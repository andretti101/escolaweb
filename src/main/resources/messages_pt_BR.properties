# ==============================================================================
# Mensagens Padronizadas do Sistema EscolaWeb (pt-BR)
# Utilizadas pelo GlobalExceptionHandler e Bean Validation para respostas amigáveis
# ==============================================================================

# Erros de validação e requisição HTTP
error.validation=Um ou mais campos obrigatórios não foram preenchidos ou contêm informações inválidas. Por favor, confira os campos destacados no formulário e tente novamente.
error.invalid.param=O valor selecionado ou informado não é válido para esta operação. Por favor, selecione uma opção válida e tente novamente.
error.malformed.body=As informações enviadas não puderam ser processadas. Por favor, recarregue a página, preencha todos os campos obrigatórios e tente novamente.
error.missing.param=O campo obrigatório "{0}" não foi informado. Por favor, preencha-o e tente novamente.
error.type.mismatch=O campo "{0}" recebeu um valor em formato incompatível. Por favor, insira um valor válido.
error.illegal.argument=Um ou mais dados informados estão incompletos ou fora dos limites permitidos. Por favor, revise as informações preenchidas no formulário e tente novamente.
error.bad.credentials=O e-mail ou a senha informados estão incorretos. Por favor, confira os dados digitados e tente novamente.
error.disabled.account=Esta conta de usuário foi desativada no sistema. Por favor, procure a secretaria escolar para solicitar a reativação.
error.access.denied=Seu usuário não possui permissão para acessar ou modificar esta funcionalidade. Caso precise deste acesso, solicite à administração ou secretaria escolar.
error.entity.not.found=O item que você tentou acessar não foi encontrado ou já foi excluído do sistema. Atualize a página para ver a lista atualizada.
error.route.not.found=A página ou endereço que você tentou acessar não existe. Por favor, retorne à página inicial ou utilize o menu de navegação.
error.method.not.allowed=A ação solicitada não pode ser executada nesta tela. Por favor, utilize os botões e opções disponíveis na página.
error.unsupported.media.type=O formato do arquivo enviado não é aceito pelo sistema. Por favor, envie um arquivo em formato compatível.
error.data.conflict=Não foi possível salvar pois já existe outro registro cadastrado com estas mesmas informações únicas. Por favor, revise os campos do formulário.
error.enrollment.in.use=Este número de matrícula já pertence a outro aluno cadastrado. Por favor, informe um número de matrícula diferente.
error.email.in.use=Este e-mail já está cadastrado para outro usuário no sistema. Por favor, utilize um endereço de e-mail diferente.
error.subject.in.use=Já existe uma disciplina cadastrada com este mesmo nome. Por favor, escolha um nome diferente para a disciplina.
error.classroom.in.use=Já existe uma turma cadastrada com este mesmo nome para este ano letivo. Por favor, utilize um nome diferente para a turma.
error.academic.year.in.use=Já existe um ano letivo cadastrado para este mesmo ano. Por favor, verifique a lista de anos letivos cadastrados.
error.foreign.key.conflict=Não é possível excluir este item porque ele possui outros dados vinculados a ele (como turmas, matrículas, aulas ou notas). Remova ou desvincule esses itens antes de tentar excluir novamente.
error.internal.server=Ocorreu uma instabilidade inesperada no sistema. Por favor, aguarde alguns instantes e tente novamente. Se o problema persistir, contate o suporte.
error.student.not.found=O aluno selecionado não foi encontrado ou já foi desativado do sistema. Verifique a lista de alunos e tente novamente.
error.teacher.not.found=O professor selecionado não foi encontrado ou já foi desativado do sistema. Verifique a lista de professores e tente novamente.
error.principal.not.found=O diretor selecionado não foi encontrado ou já foi removido do sistema. Verifique a listagem e tente novamente.
error.secretary.not.found=O secretário selecionado não foi encontrado ou já foi removido do sistema. Verifique a listagem e tente novamente.
error.unauthorized.operation=Esta operação não é permitida para o seu perfil de usuário. Caso acredite que isto seja um erro, contate o administrador da escola.
error.illegal.state=A operação não pôde ser concluída porque o cadastro atual possui pendências ou restrições (como período letivo encerrado, turma inativa ou vínculos existentes). Por favor, revise os dados e a situação do registro.
