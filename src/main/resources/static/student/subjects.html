                <div class="content-wrapper">

                        <div class="card">
                            <div class="card-header border-bottom">

                            </div>
                            
                            <div class="table-responsive text-nowrap">

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        const jwtToken = localStorage.getItem('jwt_token');
        const studentId = localStorage.getItem('user_id');

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function init() {
            if (!jwtToken || !studentId) {
                window.location.href = '/login.html';
                return;
            }

            try {
                // 1. Get student's enrollment
                const myEnrollmentsRes = await fetch(`/api/enrollments/student/${studentId}`, {
                    headers: {'Authorization': `Bearer ${jwtToken}`}
                });
                
                if (!myEnrollmentsRes.ok) throw new Error('Falha ao carregar matrículas');
                
                const myEnrollments = await myEnrollmentsRes.json();
                const activeEnrollment = myEnrollments.find(e => e.active);
                
                const tbody = document.getElementById('subjectsTableBody');
                
                if (!activeEnrollment) {
                    document.getElementById('classroomTitle').textContent = 'Nenhuma turma ativa encontrada';
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">Você não está matriculado em nenhuma turma ativa no momento.</td></tr>`;
                    return;
                }
                
                document.getElementById('classroomTitle').textContent = `Turma: ${escapeHtml(activeEnrollment.classRoomName)}`;
                
                // 2. Get subjects for classroom
                const subjectsRes = await fetch(`/api/teacher-class-subjects/classroom/${activeEnrollment.classRoomId}`, {
                    headers: {'Authorization': `Bearer ${jwtToken}`}
                });
                
                if (!subjectsRes.ok) throw new Error('Falha ao carregar matérias');
                
                let subjects = await subjectsRes.json();
                subjects.sort((a, b) => (a.subjectName || '').localeCompare(b.subjectName || ''));
                
                document.getElementById('subjectsCount').textContent = `${subjects.length} matéria(s) nesta turma`;
                
                if (subjects.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">Nenhuma matéria vinculada a esta turma ainda.</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = subjects.map(s => {
                    return `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar avatar-sm me-3">
                                        <span class="avatar-initial rounded-circle bg-label-info">
                                            <i class="bx bx-book"></i>
                                        </span>
                                    </div>
                                    <span class="fw-bold">${escapeHtml(s.subjectName)}</span>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <i class="bx bx-chalkboard text-muted me-2"></i>
                                    <span>${escapeHtml(s.teacherName)}</span>
                                </div>
                            </td>
                            <td><span class="badge bg-label-secondary">${s.minAssessmentsPerPeriod}</span></td>
                            <td><span class="badge bg-label-secondary">${s.maxAssessmentsPerPeriod}</span></td>
                        </tr>
                    `;
                }).join('');
                
            } catch (error) {
                console.error(error);
                document.getElementById('subjectsTableBody').innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-5 text-danger">
                            <i class="bx bx-error-circle fs-1 mb-2"></i>
                            <br>
                            Ocorreu um erro ao carregar as matérias da turma.
                        </td>
                    </tr>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
