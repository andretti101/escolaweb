                <div class="content-wrapper">

                        <div class="card mb-4">
                            <h5 class="card-header">Informações Gerais (Somente Leitura)</h5>
                            <div class="card-body">
                                <form>
                                    <div class="row">
                                        <div class="mb-3 col-md-6">
                                            <label for="schoolName" class="form-label">Nome da Escola</label>
                                            <input class="form-control" type="text" id="schoolName" readonly />
                                        </div>
                                        <div class="mb-3 col-md-6">
                                            <label for="contactEmail" class="form-label">E-mail de Contato</label>
                                            <input class="form-control" type="email" id="contactEmail" readonly />
                                        </div>
                                        <div class="mb-3 col-md-6">
                                            <label for="phone" class="form-label">Telefone</label>
                                            <input type="text" class="form-control" id="phone" readonly />
                                        </div>
                                        <div class="mb-3 col-md-6">
                                            <label for="address" class="form-label">Endereço</label>
                                            <input type="text" class="form-control" id="address" readonly />
                                        </div>
                                    </div>
                                    
                                    <hr class="my-4" />
                                    <h6 class="mb-3 text-muted"><i class="bx bx-book-bookmark me-2"></i>Parâmetros Acadêmicos</h6>
                                    
                                    <div class="row">
                                        <div class="mb-3 col-md-4">
                                            <label for="periodType" class="form-label">Divisão do Ano Letivo</label>
                                            <input class="form-control" type="text" id="periodType" readonly />
                                        </div>
                                        <div class="mb-3 col-md-4">
                                            <label for="minimumGrade" class="form-label">Média Mínima para Aprovação</label>
                                            <input class="form-control" type="text" id="minimumGrade" readonly />
                                        </div>
                                        <div class="mb-3 col-md-4">
                                            <label for="minimumAttendance" class="form-label">Frequência Mínima (%)</label>
                                            <input class="form-control" type="text" id="minimumAttendance" readonly />
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>

    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        const jwtToken = localStorage.getItem('jwt_token');

        async function loadSettings() {
            try {
                const response = await fetch('/api/school-settings', {
                    headers: { 'Authorization': `Bearer ${jwtToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('schoolName').value = data.schoolName || '';
                    document.getElementById('contactEmail').value = data.email || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('address').value = data.address || '';
                    
                    const periodTypes = {
                        'BIMESTER': 'Bimestral (4 Períodos)',
                        'TRIMESTER': 'Trimestral (3 Períodos)',
                        'QUADRIMESTER': 'Quadrimestral (3 Períodos)',
                        'SEMESTER': 'Semestral (2 Períodos)',
                        'ANNUAL': 'Anual (1 Período)'
                    };
                    document.getElementById('periodType').value = periodTypes[data.periodType] || data.periodType || '';
                    document.getElementById('minimumGrade').value = data.minimumGrade != null ? Number(data.minimumGrade).toFixed(1) : '';
                    document.getElementById('minimumAttendance').value = data.minimumAttendance != null ? data.minimumAttendance + '%' : '';
                }
            } catch (error) {
                console.error('Erro ao carregar configurações:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
