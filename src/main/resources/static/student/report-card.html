                    </div>

                    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                        <!-- Título da Navbar -->

                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Meu Desempenho /</span> Boletim Final</h4>

                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                                <h5 class="mb-0">Resultado Consolidado</h5>
                                <div id="generalStatusContainer" class="d-flex align-items-center gap-2 mt-1 mt-sm-0">
                                    <span class="text-muted fw-semibold">Situação Geral:</span>
                                    <span id="generalStatusBadge" class="badge bg-label-secondary">Carregando...</span>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <thead id="reportHead">
                                        <tr><th>Carregando...</th></tr>
                                    </thead>
                                    <tbody id="reportBody">
                                        <tr><td><span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span> Aguarde...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        const jwtToken = localStorage.getItem('jwt_token');
        const studentId = localStorage.getItem('user_id');

        async function loadReportCard() {
            if (!studentId) return;

            try {
                let activeYear = null;
                const yrRes = await fetch('/api/academic-years/active', { headers: {'Authorization': 'Bearer ' + jwtToken} });
                if (yrRes.ok) activeYear = await yrRes.json();

                let attendanceReport = { absencesPerSubject: {}, generalFrequency: 100 };
                const queryYear = activeYear ? '?yearId=' + activeYear.id : '';
                const attRes = await fetch(`/api/attendances/report/student/${studentId}` + queryYear, { headers: {'Authorization': `Bearer ${jwtToken}`} });
                if (attRes.ok) attendanceReport = await attRes.json();

                if (activeYear) {
                    const rcRes = await fetch(`/api/report-cards/student/${studentId}/year/${activeYear.id}`, { headers: {'Authorization': 'Bearer ' + jwtToken} });
                    if (rcRes.ok) {
                        const rc = await rcRes.json();
                        const periodNames = new Set();
                        rc.subjects.forEach(s => s.periodGrades.forEach(pg => periodNames.add(pg.periodName)));
                        const sortedPeriods = Array.from(periodNames).sort();
                        
                        const thead = document.getElementById('reportHead');
                        thead.innerHTML = `
                            <tr class="table-primary">
                                <th>Disciplina</th>
                                ${sortedPeriods.map(p => `<th>${p}</th>`).join('')}
                                <th>Média Final</th>
                                <th>Faltas</th>
                                <th>Situação</th>
                            </tr>
                        `;

                        const tbody = document.getElementById('reportBody');
                        let html = '';

                        rc.subjects.forEach(s => {
                            let rowHtml = `<td><strong>${s.subjectName}</strong></td>`;
                            sortedPeriods.forEach(p => {
                                const pg = s.periodGrades.find(x => x.periodName === p);
                                if(pg && pg.average != null) {
                                    rowHtml += `<td>${pg.average.toFixed(1)}</td>`;
                                } else {
                                    rowHtml += `<td class="text-muted">-</td>`;
                                }
                            });

                            let finalAvgHtml = `<span class="text-muted">-</span>`;
                            let gradesCount = s.periodGrades.filter(pg => pg.average != null).length;
                            if (gradesCount === rc.totalPeriods || s.situation === 'APPROVED' || s.situation === 'FAILED') {
                                let sumAverages = s.periodGrades.reduce((acc, pg) => acc + (pg.average || 0), 0);
                                let finalAvg = sumAverages / rc.totalPeriods;
                                finalAvgHtml = `<strong>${finalAvg.toFixed(1)}</strong>`;
                            }

                            let situationHtml = '<span class="badge bg-label-warning">Pendente</span>';
                            if (s.situation === 'APPROVED') situationHtml = '<span class="badge bg-label-success">Aprovado</span>';
                            else if (s.situation === 'FAILED') situationHtml = '<span class="badge bg-label-danger">Reprovado</span>';

                            const absences = attendanceReport.absencesPerSubject[s.subjectName] || 0;

                            rowHtml += `<td>${finalAvgHtml}</td><td>${absences}</td><td>${situationHtml}</td>`;
                            html += `<tr>${rowHtml}</tr>`;
                        });
                        
                        if (rc.subjects.length === 0) {
                            html = `<tr><td colspan="${sortedPeriods.length + 4}" class="text-center text-muted">Nenhuma nota encontrada.</td></tr>`;
                        }

                        let freqSituationHtml = '<span class="badge bg-label-warning">PENDENTE</span>';
                        if (rc.frequency.situation === 'APPROVED') freqSituationHtml = '<span class="badge bg-label-success">APROVADO</span>';
                        else if (rc.frequency.situation === 'FAILED') freqSituationHtml = '<span class="badge bg-label-danger">REPROVADO</span>';

                        if (rc.subjects.length > 0) {
                            html += `
                                <tr>
                                    <td colspan="${sortedPeriods.length + 4}" class="text-end fw-bold">
                                        Frequência Geral Escolar: ${rc.frequency.generalFrequency.toFixed(2)}% ${freqSituationHtml}
                                    </td>
                                </tr>
                            `;
                        }

                        tbody.innerHTML = html;

                        // UPDATE HEADER BADGE
                        const generalStatus = rc.generalSituation;
                        const badgeEl = document.getElementById('generalStatusBadge');
                        if (badgeEl) {
                            if (generalStatus === 'APPROVED') {
                                badgeEl.className = 'badge bg-label-success fs-6';
                                badgeEl.innerHTML = '<i class="bx bx-check-circle me-1"></i> Aprovado';
                            } else if (generalStatus === 'FAILED') {
                                badgeEl.className = 'badge bg-label-danger fs-6';
                                badgeEl.innerHTML = '<i class="bx bx-x-circle me-1"></i> Reprovado';
                            } else {
                                badgeEl.className = 'badge bg-label-warning fs-6';
                                badgeEl.innerHTML = '<i class="bx bx-time me-1"></i> Pendente';
                            }
                        }
                    } else {
                        throw new Error('Falha ao obter boletim');
                    }
                } else {
                    document.getElementById('reportHead').innerHTML = '<tr><td class="text-warning">Nenhum ano letivo ativo</td></tr>';
                    document.getElementById('reportBody').innerHTML = '';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('reportHead').innerHTML = '<tr><td class="text-danger">Erro de conexão</td></tr>';
                document.getElementById('reportBody').innerHTML = '';
            }
        }
        
        loadReportCard();
    </script>
