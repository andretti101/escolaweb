<!DOCTYPE html>

      data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Mural de Recados | Escola Web</title>
    <script src="/js/auth-guard.js"></script>
    <meta name="description" content="Mural de Recados"/>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=5"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <style>
        .card-announcement {
            border-radius: 12px;
            transition: box-shadow 0.3s ease-in-out;
        }
        .card-announcement:hover {
            box-shadow: 0 .25rem 1rem rgba(161,172,184,.45);
        }
        .border-left-primary { border-left: 4px solid #696cff !important; }
        .border-left-success { border-left: 4px solid #71dd37 !important; }
        .border-left-warning { border-left: 4px solid #ffab00 !important; }
    </style>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/student-sidebar.html"></div>
        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>
                    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Organização Acadêmica /</span> Mural de Recados</h4>
                    
                    <div id="loading" class="text-center my-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>

                    <div id="emptyState" class="d-none text-center my-5">
                        <i class="bx bx-info-circle bx-lg text-muted mb-3"></i>
                        <h5 class="text-muted">Nenhum aviso para sua turma.</h5>
                    </div>

                    <!-- Avisos Fixados -->
                    <div id="fixedEventsSection" class="d-none">
                        <h5 class="fw-bold text-primary mb-3"><i class="bx bx-pin me-2"></i>Avisos Fixados</h5>
                        <div class="row mb-5" id="fixedAnnouncementGrid"></div>
                        <hr class="my-5" />
                    </div>
                    
                    <div class="row" id="announcementGrid">
                        <!-- Cards will be rendered here -->
                    </div>
                    
                    <div id="pastEventsSection" class="d-none mt-5">
                        <div class="divider text-start mb-4">
                            <div class="divider-text"><h5 class="fw-bold mb-0">Eventos passados</h5></div>
                        </div>
                        <div class="row" id="pastAnnouncementGrid">
                        </div>
                    </div>
                    
                </div>
                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-fluid d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            Copyright © 2026 EscolaWEB. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>
<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/js/load-sidebar.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("jwt_token");
        const grid = document.getElementById("announcementGrid");
        const loading = document.getElementById("loading");
        const emptyState = document.getElementById("emptyState");

        fetch("/api/announcements/my-classroom", {
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        })
        .then(response => {
            if (!response.ok) throw new Error("Erro ao carregar avisos");
            return response.json();
        })
          .then(data => {
              fetch('/api/announcements/mark-read', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(console.error);
              loading.classList.add("d-none");
            if (!data || data.length === 0) {
                emptyState.classList.remove("d-none");
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const fixed = [];
            const upcoming = [];
            const past = [];

            data.forEach(item => {
                if (!item.eventDate) {
                    fixed.push(item);
                    return;
                }
                
                const d = new Date(item.eventDate + "T00:00:00");
                const parsedDate = isNaN(d) ? new Date(item.eventDate) : d;
                item._parsedDate = parsedDate;
                
                if (parsedDate < today) {
                    past.push(item);
                } else {
                    upcoming.push(item);
                }
            });

            // Ordena pr�ximos da data mais pr�xima para a mais distante (crescente)
            upcoming.sort((a, b) => {
                if (!a._parsedDate) return 1;
                if (!b._parsedDate) return -1;
                return a._parsedDate - b._parsedDate;
            });

            // Ordena passados da data mais recente para a mais antiga (decrescente)
            past.sort((a, b) => {
                if (!a._parsedDate) return 1;
                if (!b._parsedDate) return -1;
                return b._parsedDate - a._parsedDate;
            });

            function renderCard(item, container) {
                let borderClass = "border-left-primary";
                if (item.authorRole) {
                    const role = item.authorRole.toLowerCase();
                    if (role === "secretaria" || role === "secretary") {
                        borderClass = "border-left-success";
                    } else if (role === "dire��o" || role === "direcao" || role === "principal") {
                        borderClass = "border-left-warning";
                    }
                }

                let dateStr = "";
                if (item._parsedDate) {
                    dateStr = item._parsedDate.toLocaleDateString("pt-BR");
                }

                const col = document.createElement("div");
                col.className = "col-md-6 col-lg-4 mb-4";
                
                // Remove color borders for past events to match "grayed out" feel? The user didn't ask, but their example keeps the border.
                
                col.innerHTML = `
                    <div class="card card-announcement h-100 ${borderClass}">
                        <div class="card-body">
                            <h6 class="card-title fw-bold mb-1">${escapeHtml(item.title)}</h6>
                            <p class="card-text text-muted mb-2" style="white-space: pre-wrap;">${escapeHtml((item.message || "").replace(/(?:\r?\n\s*){2,}/g, "\n"))}</p>
                            ${dateStr ? `<small class="text-muted"><i class="bx bx-calendar me-1"></i>Data: ${dateStr}</small>` : ''}
                            <small class="d-block mt-2 text-muted">agendado por: <strong>${escapeHtml(item.authorName || 'Desconhecido')}</strong> (${escapeHtml(item.authorRole || 'Professor')})</small>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            }

            if (fixed.length > 0) {
                document.getElementById("fixedEventsSection").classList.remove("d-none");
                const fixedGrid = document.getElementById("fixedAnnouncementGrid");
                fixed.forEach(item => renderCard(item, fixedGrid));
            }

            upcoming.forEach(item => renderCard(item, grid));

            if (past.length > 0) {
                document.getElementById("pastEventsSection").classList.remove("d-none");
                const pastGrid = document.getElementById("pastAnnouncementGrid");
                past.forEach(item => renderCard(item, pastGrid));
            }
        })
        .catch(error => {
            loading.classList.add("d-none");
            console.error(error);
            emptyState.innerHTML = `<i class="bx bx-error bx-lg text-danger mb-3"></i><h5 class="text-danger">Erro ao carregar avisos.</h5>`;
            emptyState.classList.remove("d-none");
        });

        function escapeHtml(unsafe) {
            return (unsafe || "").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    });
</script>
</body>
</html>
