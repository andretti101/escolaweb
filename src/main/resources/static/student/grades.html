<!DOCTYPE html>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provas e Trabalhos | Escola Web</title>
    <script src="/js/auth-guard.js"></script>
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="/assets/css/demo.css" />
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
</head>
<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <div id="sidebar-container" data-sidebar="/components/student-sidebar.html"></div>
            <div class="layout-page">
                <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme shadow-sm" id="layout-navbar">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                        <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i>
                        </a>
                    </div>

                    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                        <!-- Título da Navbar -->
                        <div class="navbar-nav align-items-center w-100 d-none d-md-flex">
                            <span class="fs-4 fw-bold d-flex align-items-center">
                                <i class="bx bxs-graduation fs-3 text-primary me-2"></i> 
                                <span class="text-primary">Portal do Aluno</span>
                            </span>
                        </div>

                        <!-- Avatar do Usuário -->
                        <ul class="navbar-nav flex-row align-items-center ms-auto">
                            <li class="nav-item navbar-dropdown dropdown-user dropdown">
                                <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                                    <div class="avatar avatar-online">
                                        <span class="avatar-initial rounded-circle bg-label-primary" id="dropdownAvatarInitial">A</span>
                                    </div>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item" href="#">
                                            <div class="d-flex">
                                                <div class="flex-shrink-0 me-3">
                                                    <div class="avatar avatar-online">
                                                        <span class="avatar-initial rounded-circle bg-label-primary" id="dropdownAvatarInitialInner">A</span>
                                                    </div>
                                                </div>
                                                <div class="flex-grow-1">
                                                    <span class="fw-semibold d-block" id="dropdownUserName">Aluno</span>
                                                    <small class="text-muted">Estudante</small>
                                                </div>
                                            </div>
                                        </a>
                                    </li>
                                    <li><div class="dropdown-divider"></div></li>
                                    <li>
                                        <a class="dropdown-item" href="javascript:void(0);" id="btnLogoutNavbar">
                                            <i class="bx bx-power-off me-2 text-danger"></i>
                                            <span class="align-middle text-danger">Sair</span>
                                        </a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </nav>

                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Meu Desempenho /</span> Provas e Trabalhos</h4>

                        <!-- Filtro de Período -->
                        <div class="card mb-4">
                            <div class="card-body">
                                <div class="row justify-content-center text-center">
                                    <div class="col-md-6 col-lg-4">
                                        <label for="periodSelect" class="form-label text-uppercase fw-bold text-muted small mb-3">Selecione o Período Acadêmico</label>
                                        <select id="periodSelect" class="form-select form-select-lg">
                                            <option value="">Carregando...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Matérias do Período -->
                        <div id="subjectsContainer" class="row mb-4 d-none justify-content-center text-center">
                            <div class="col-12"><h5 class="mb-3 text-muted fw-bold">Disciplinas</h5></div>
                            <div id="subjectsList" class="d-flex flex-column gap-3 col-12 col-md-8 col-lg-6 mx-auto"></div>
                        </div>

                        <!-- Tabela de Notas Oculta -->
                        <div id="gradesTableContainer" class="card d-none">
                            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                                <h5 class="mb-0">Notas de <span id="currentSubjectName" class="text-primary"></span></h5>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Avaliação</th>
                                            <th>Tipo</th>
                                            <th>Data Lançamento</th>
                                            <th>Nota</th>
                                        </tr>
                                    </thead>
                                    <tbody id="gradesTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        const jwtToken = localStorage.getItem('jwt_token');
        const studentId = localStorage.getItem('user_id');
        let allGrades = [];
        let selectedPeriod = null;

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function init() {
            if (!studentId) return;
            try {
                const res = await fetch(`/api/grades/student/${studentId}`, { headers: {'Authorization': `Bearer ${jwtToken}`} });
                if (res.ok) {
                    allGrades = await res.json();
                    buildPeriodDropdown();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function buildPeriodDropdown() {
            const select = document.getElementById('periodSelect');
            const periods = [...new Set(allGrades.filter(g => g.periodName).map(g => g.periodName))].sort();
            
            if (periods.length === 0) {
                select.innerHTML = '<option value="">Nenhuma nota encontrada</option>';
                return;
            }

            // Removendo o "-- Escolha um período --" e setando as opções diretas
            select.innerHTML = periods.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');

            select.value = periods[0];
            selectedPeriod = periods[0];
            showSubjectsForPeriod();

            select.addEventListener('change', (e) => {
                selectedPeriod = e.target.value;
                document.getElementById('gradesTableContainer').classList.add('d-none');
                if (selectedPeriod) {
                    showSubjectsForPeriod();
                } else {
                    document.getElementById('subjectsContainer').classList.add('d-none');
                }
            });
        }

        function showSubjectsForPeriod() {
            const container = document.getElementById('subjectsContainer');
            const list = document.getElementById('subjectsList');
            
            const gradesInPeriod = allGrades.filter(g => g.periodName === selectedPeriod);
            const subjects = [...new Set(gradesInPeriod.map(g => g.subjectName))].sort();

            list.innerHTML = subjects.map(subj => `
                <button type="button" class="btn btn-outline-primary btn-lg w-100" onclick="showGradesForSubject('${escapeHtml(subj)}')">
                    ${escapeHtml(subj)}
                </button>
            `).join('');

            container.classList.remove('d-none');
        }

        function showGradesForSubject(subject) {
            document.getElementById('currentSubjectName').textContent = subject;
            
            const tbody = document.getElementById('gradesTableBody');
            const grades = allGrades.filter(g => g.periodName === selectedPeriod && g.subjectName === subject);

            const typeMap = {
                'EXAM': 'Prova',
                'ASSIGNMENT': 'Trabalho',
                'PROJECT': 'Projeto',
                'PRESENTATION': 'Apresentação'
            };

            if (grades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">Nenhuma avaliação encontrada.</td></tr>';
            } else {
                tbody.innerHTML = grades.map(g => `
                    <tr>
                        <td><strong>${escapeHtml(g.assessmentTitle)}</strong></td>
                        <td><span class="badge bg-label-info">${escapeHtml(typeMap[g.assessmentType] || g.assessmentType)}</span></td>
                        <td>${new Date(g.createdAt).toLocaleDateString('pt-BR')}</td>
                        <td><strong>${g.value != null ? Number(g.value).toFixed(1) : '-'}</strong></td>
                    </tr>
                `).join('');
            }

            document.getElementById('gradesTableContainer').classList.remove('d-none');
        }

        init();
    </script>
</body>
</html>
