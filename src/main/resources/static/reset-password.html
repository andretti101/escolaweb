<!DOCTYPE html>
<html
        lang="pt-BR"
        class="light-style customizer-hide"
        dir="ltr"
        data-theme="theme-default"
        data-assets-path="/assets/"
        data-template="vertical-menu-template-free"
>
<head>
    <meta charset="utf-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>Redefinir Senha - EscolaWEB SGE</title>

    <meta name="description" content="Sistema de Gestão Escolar - EscolaWEB"/>

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=3"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>

    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>

    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>

    <link rel="stylesheet" href="/assets/vendor/css/pages/page-auth.css"/>
    <script src="/assets/vendor/js/helpers.js"></script>

    <script src="/assets/js/config.js"></script>
</head>

<body>
<div class="container-xxl">
    <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner py-4">
            <div class="card" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="card-body p-4 pt-3">

                    <div class="app-brand justify-content-center mb-2" style="min-height: auto;">
                        <a href="login.html" class="app-brand-link gap-2">
                  <span class="app-brand-logo demo" style="height: auto; width: auto;">
                    <img
                            src="/assets/img/Logo.png"
                            alt="EscolaWEB Logo"
                            style="max-width: 280px; height: auto; display: block;"
                    />
                  </span>
                        </a>
                    </div>
                    <h4 class="mb-1 text-center">Redefinir senha</h4>
                    <p class="mb-3 text-center">Informe sua nova senha abaixo</p>

                    <!-- Alert feedback -->
                    <div id="alertContainer"></div>

                    <form id="formResetPassword" class="mb-3">
                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="newPassword">Nova Senha</label>
                            <div class="input-group input-group-merge">
                                <input
                                        type="password"
                                        id="newPassword"
                                        class="form-control"
                                        style="border-top-left-radius: 10px; border-bottom-left-radius: 10px;"
                                        placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                                        minlength="8"
                                        required
                                />
                                <span
                                        class="input-group-text cursor-pointer"
                                        style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;"
                                >
                      <i class="bx bx-hide"></i>
                    </span>
                            </div>
                        </div>
                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="confirmPassword">Confirmar Nova Senha</label>
                            <div class="input-group input-group-merge">
                                <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        style="border-top-left-radius: 10px; border-bottom-left-radius: 10px;"
                                        placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                                        minlength="8"
                                        required
                                />
                                <span
                                        class="input-group-text cursor-pointer"
                                        style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;"
                                >
                      <i class="bx bx-hide"></i>
                    </span>
                            </div>
                        </div>
                        <button id="btnSubmit" class="btn btn-primary d-grid w-100" style="border-radius: 10px;"
                                type="submit">
                            Redefinir Senha
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="login.html" class="d-flex align-items-center justify-content-center">
                            <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
                            Voltar para o login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>
</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("formResetPassword");
        const btn = document.getElementById("btnSubmit");
        const alertContainer = document.getElementById("alertContainer");

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        function showAlert(type, message) {
            alertContainer.innerHTML = `
          <div class="alert alert-${type} alert-dismissible mb-3" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
        }

        if (!token) {
            showAlert(
                "danger",
                '<i class="bx bx-error-circle me-1"></i>Token de redefinição não encontrado. ' +
                '<a href="forgot-password.html">Solicite um novo link</a>.'
            );
            btn.disabled = true;
            return;
        }

        document.querySelectorAll(".form-password-toggle .input-group-text").forEach((el) => {
            el.addEventListener("click", () => {
                const input = el.previousElementSibling;
                const icon = el.querySelector("i");
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.replace("bx-hide", "bx-show");
                } else {
                    input.type = "password";
                    icon.classList.replace("bx-show", "bx-hide");
                }
            });
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertContainer.innerHTML = "";

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {
                showAlert("danger", "A senha deve ter pelo menos 8 caracteres.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert("danger", "As senhas não coincidem. Verifique e tente novamente.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Redefinindo...';

            try {
                const response = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({token, newPassword}),
                });

                if (response.ok || response.status === 204) {
                    showAlert(
                        "success",
                        '<i class="bx bx-check-circle me-1"></i>Senha redefinida com sucesso! Redirecionando para o login...'
                    );
                    form.style.display = "none";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                } else {
                    const errorData = await response.json().catch(() => null);
                    showAlert(
                        "danger",
                        errorData?.message ||
                        "Erro ao redefinir a senha. O link pode ter expirado."
                    );
                    btn.disabled = false;
                    btn.innerHTML = "Redefinir Senha";
                }
            } catch (error) {
                console.error("Erro:", error);
                showAlert(
                    "danger",
                    "Erro ao conectar com o servidor. O backend está rodando?"
                );
                btn.disabled = false;
                btn.innerHTML = "Redefinir Senha";
            }
        });
    });
</script>
</html>
