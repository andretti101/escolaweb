<!DOCTYPE html>
<html
  lang="pt-BR"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="/assets/"
  data-template="vertical-menu-template-free"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>Esqueceu a Senha - EscolaWEB SGE</title>

    <meta name="description" content="Sistema de Gestão Escolar - EscolaWEB" />

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />

    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="/assets/css/demo.css" />

    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />

    <link rel="stylesheet" href="/assets/vendor/css/pages/page-auth.css" />
    <script src="/assets/vendor/js/helpers.js"></script>

    <script src="/assets/js/config.js"></script>
  </head>

  <body>
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner py-4">
          <div class="card" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <div class="card-body p-4 pt-3">

              <div class="app-brand justify-content-center mb-2" style="min-height: auto;">
                <a href="login.html" class="app-brand-link gap-2">
                  <span class="app-brand-logo demo" style="height: auto; width: auto;">
                    <img
                      src="/assets/img/Logo.svg"
                      alt="EscolaWEB Logo"
                      style="max-width: 170px; height: auto; display: block;"
                    />
                  </span>
                </a>
              </div>
              <h4 class="mb-1 text-center">Esqueceu a senha?</h4>
              <p class="mb-3 text-center">Insira seu email e enviaremos instruções para redefinir sua senha</p>

              <!-- Alert feedback -->
              <div id="alertContainer"></div>

              <form id="formForgotPassword" class="mb-3">
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    style="border-radius: 10px;"
                    id="email"
                    name="email"
                    placeholder="Insira seu email"
                    autofocus
                    required
                  />
                </div>
                <button id="btnSubmit" class="btn btn-primary d-grid w-100" style="border-radius: 10px;" type="submit">
                  Enviar link de redefinição
                </button>
              </form>

              <div class="text-center">
                <a href="login.html" class="d-flex align-items-center justify-content-center">
                  <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
                  Voltar para o login
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("formForgotPassword");
      const btn = document.getElementById("btnSubmit");
      const alertContainer = document.getElementById("alertContainer");

      function showAlert(type, message) {
        alertContainer.innerHTML = `
          <div class="alert alert-${type} alert-dismissible mb-3" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = "";

        const email = document.getElementById("email").value.trim();
        if (!email) {
          showAlert("danger", "Por favor, informe seu e-mail.");
          return;
        }

        btn.disabled = true;
        btn.innerHTML =
          '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Enviando...';

        try {
          const response = await fetch("/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          if (response.ok) {
            const data = await response.json();
            showAlert(
              "success",
              '<i class="bx bx-check-circle me-1"></i>' + data.message
            );
            form.reset();
          } else {
            const errorData = await response.json().catch(() => null);
            showAlert(
              "danger",
              errorData?.message ||
                "Erro ao processar a solicitação. Tente novamente."
            );
          }
        } catch (error) {
          console.error("Erro:", error);
          showAlert(
            "danger",
            "Erro ao conectar com o servidor. O backend está rodando?"
          );
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Enviar link de redefinição";
        }
      });
    });
  </script>
</html>
