<!DOCTYPE html>
<html
        lang="pt-BR"
        class="light-style customizer-hide"
        dir="ltr"
        data-theme="theme-default"
        data-assets-path="/assets/"
        data-template="vertical-menu-template-free"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Login - EscolaWEB SGE</title>
    <meta name="description" content="Sistema de Gestão Escolar - EscolaWEB"/>

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=3"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/pages/page-auth.css"/>

    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
</head>

<body>
<div class="container-xxl">
    <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">

            <div class="card" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="card-body p-4 pt-3">

                    <div class="app-brand justify-content-center mb-2" style="min-height: auto;">
                        <a href="login.html" class="app-brand-link gap-2">
                <span class="app-brand-logo demo" style="height: auto; width: auto;">
                  <img
                          src="/assets/img/Logo.png"
                          alt="EscolaWEB Logo"
                          style="max-width: 280px; height: auto; display: block;"
                  />
                </span>
                        </a>
                    </div>
                    <h4 class="mb-1 text-center">Bem-vindo ao EscolaWEB!</h4>
                    <p class="mb-3 text-center">Por favor, faça login para acessar o sistema escolar</p>

                    <form id="formAuthentication" class="mb-3" action="index.html" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    style="border-radius: 10px;"
                                    id="email"
                                    name="email-username"
                                    placeholder="Insira seu email"
                                    autofocus
                            />
                        </div>
                        <div class="mb-3 form-password-toggle">
                            <div class="d-flex justify-content-between">
                                <label class="form-label" for="password">Senha</label>
                                <a href="forgot-password.html">
                                    <small>Esqueceu a senha?</small>
                                </a>
                            </div>
                            <div class="input-group input-group-merge">
                                <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        style="border-top-left-radius: 10px; border-bottom-left-radius: 10px;"
                                        name="password"
                                        placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                                        aria-describedby="password"
                                />
                                <span class="input-group-text cursor-pointer"
                                      style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
                    <i class="bx bx-hide"></i>
                  </span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-primary d-grid w-100" style="border-radius: 10px;" type="submit">
                                Entrar
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>
<script async defer src="https://buttons.github.io/buttons.js"></script>
</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("formAuthentication");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({email, password})
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("Dados recebidos do login:", data);

                    // 1. Salva os tokens
                    localStorage.setItem("jwt_token", data.accessToken);
                    localStorage.setItem("refresh_token", data.refreshToken);

                    // 2. Lê a role
                    const userRole = String(data.role ?? "").toUpperCase();
                    console.log("Role para redirecionamento:", userRole);

                    // 3. Redireciona pelo perfil
                    if (userRole.includes("PRINCIPAL")) {
                        window.location.href = "principal/dashboard.html";
                    } else if (userRole.includes("SECRETARY")) {
                        window.location.href = "secretary/dashboard.html";
                    } else if (userRole.includes("TEACHER")) {
                        window.location.href = "/teacher/dashboard.html";
                    } else if (userRole.includes("STUDENT")) {
                        window.location.href = "/student/dashboard.html";
                    } else {
                        alert("Atenção: role não mapeada — [" + userRole + "]. Verifique o F12.");
                        console.error("Resposta completa:", data);
                    }

                } else {
                    const errorData = await response.json().catch(() => null);
                    let message = errorData?.message ?? "Erro desconhecido. Tente novamente.";

                    if (message === "Bad credentials") {
                        message = "E-mail ou senha incorretos. Tente novamente.";
                    }

                    alert(message);
                }

            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro ao conectar com o servidor. O backend está rodando?");
            }
        });
    });
</script>
