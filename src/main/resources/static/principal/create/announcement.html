<!DOCTYPE html>
<html lang="pt-BR" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default"
      data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Mural de Recados / Novo Aviso | Escola Web</title>
    <script src="/js/auth-guard.js"></script>
    <meta name="description" content="Novo Aviso"/>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=5"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <style>
        .search-select-container { position: relative; }
        .search-select-input { cursor: text; }
        .search-select-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 1050;
            max-height: 250px; overflow-y: auto; background: #fff;
            border: 1px solid #d9dee3; border-top: none; border-radius: 0 0 .375rem .375rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); display: none;
        }
        .search-select-dropdown.show { display: block; }
        .search-select-dropdown .dropdown-item {
            padding: .5rem .75rem; cursor: pointer; font-size: .875rem;
            display: flex; align-items: center; gap: .5rem;
        }
        .search-select-dropdown .dropdown-item:hover { background: #f5f5f9; }
        .search-select-dropdown .dropdown-item.disabled { color: #a1acb8; cursor: default; pointer-events: none; }
        .search-select-dropdown .no-results { padding: .75rem; text-align: center; color: #a1acb8; font-size: .875rem; }
        .selected-tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .5rem; }
        .selected-tag {
            display: inline-flex; align-items: center; gap: .25rem;
            background: #e7e7ff; color: #696cff; border-radius: .25rem;
            padding: .15rem .5rem; font-size: .8125rem;
        }
        .selected-tag .remove-tag { cursor: pointer; font-weight: bold; line-height: 1; }
        .selected-tag .remove-tag:hover { color: #ff3e1d; }
    </style>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/principal-sidebar.html"></div>
        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>
                    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Mural de Recados /</span> Novo Aviso</h4>
                    
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Criar Novo Aviso</h5>
                            <a href="/principal/announcements.html" class="btn btn-sm btn-outline-secondary">
                                <i class="bx bx-arrow-back"></i> Voltar
                            </a>
                        </div>
                        <div class="card-body">
                            <div id="alertMessage"></div>
                            <form id="announcementForm">
                                <div class="mb-3">
                                    <label class="form-label" for="title">Título do Aviso</label>
                                    <div class="input-group input-group-merge">
                                        <span class="input-group-text"><i class="bx bx-message-detail"></i></span>
                                        <input type="text" class="form-control" id="title" required maxlength="100" placeholder="Título"/>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="eventDate">Data do Evento</label>
                                    <div class="input-group input-group-merge">
                                        <span class="input-group-text"><i class="bx bx-calendar"></i></span>
                                        <input type="date" class="form-control" id="eventDate" />
                                    </div>
                                    <div class="form-text mt-1">Deixe em branco se for apenas um recado sem data específica.</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label d-block">Destinatários</label>
                                    <div class="form-check form-check-inline mt-2">
                                        <input class="form-check-input" type="radio" name="targetAudience" id="targetStudents" value="students" checked />
                                        <label class="form-check-label" for="targetStudents">Alunos (Turmas)</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="targetAudience" id="targetTeachers" value="teachers" />
                                        <label class="form-check-label" for="targetTeachers">Professores</label>
                                    </div>
                                </div>
                                <div class="mb-3" id="classRoomsWrapper">
                                    <label class="form-label" for="classRoomSearch">Turmas Destino</label>
                                    <div class="search-select-container" id="classRoomSearchContainer">
                                        <input type="text" class="form-control search-select-input" id="classRoomSearch" placeholder="Buscar e selecionar turmas..." autocomplete="off"/>
                                        <div class="search-select-dropdown shadow-sm" id="classRoomDropdown"></div>
                                    </div>
                                    <div class="selected-tags" id="selectedClassRoomsContainer"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="message">Mensagem</label>
                                    <textarea class="form-control" id="message" required rows="4" maxlength="200" placeholder="Digite o aviso..."></textarea>
                                    <div class="form-text mt-1 d-flex justify-content-end" id="charCounter">0/200 caracteres</div>
                                </div>
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true" id="submitSpinner"></span>
                                    Publicar Aviso
                                </button>
                            </form>
                        </div>
                    </div>
                    
                </div>
                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-fluid d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            Copyright © 2026 EscolaWEB. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>
<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/js/load-sidebar.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("jwt_token");
                const form = document.getElementById("announcementForm");
        const alertMessage = document.getElementById("alertMessage");
        const messageInput = document.getElementById("message");
        const charCounter = document.getElementById("charCounter");
        
            const targetStudents = document.getElementById("targetStudents");
            const targetTeachers = document.getElementById("targetTeachers");
            const classRoomsWrapper = document.getElementById("classRoomsWrapper");

            if (targetStudents && targetTeachers) {
                targetStudents.addEventListener("change", () => classRoomsWrapper.classList.remove("d-none"));
                targetTeachers.addEventListener("change", () => classRoomsWrapper.classList.add("d-none"));
            }
            
            const submitBtn = document.getElementById("submitBtn");
        const submitSpinner = document.getElementById("submitSpinner");

        
        let allClassrooms = [];
        let selectedClassrooms = [];
        const classRoomSearch = document.getElementById("classRoomSearch");
        const classRoomDropdown = document.getElementById("classRoomDropdown");
        const classRoomSearchContainer = document.getElementById("classRoomSearchContainer");
        const selectedClassRoomsContainer = document.getElementById("selectedClassRoomsContainer");

        fetch("/api/classrooms?activeOnly=false", {
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        })
        .then(async response => {
            if (!response.ok) throw new Error("HTTP " + response.status);
            return response.json();
        })
        .then(data => {
            if (Array.isArray(data)) allClassrooms = data;
            else if (data && Array.isArray(data.content)) allClassrooms = data.content;
            else if (data && Array.isArray(data.data)) allClassrooms = data.data;
              if (allClassrooms) allClassrooms.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            if (allClassrooms) allClassrooms.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        })
        .catch(error => console.error("Error loading classrooms", error));

        function escapeHtml(unsafe) {
            return (unsafe || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function translateShift(shift) {
            if (!shift) return "";
            switch(shift.toUpperCase()) {
                case 'MORNING': return 'Matutino';
                case 'AFTERNOON': return 'Vespertino';
                case 'NIGHT': return 'Noturno';
                case 'FULL_TIME': return 'Integral';
                case 'EVENING': return 'Noturno';
                default: return shift;
            }
        }

        function renderDropdown(query) {
            const q = (query || '').toLowerCase().trim();
            const available = allClassrooms.filter(c => !selectedClassrooms.some(s => s.id === c.id));
            let filtered = available;
            if (q) {
                filtered = available.filter(c => 
                    (c.name || '').toLowerCase().includes(q) || 
                    translateShift(c.shift).toLowerCase().includes(q) ||
                    (c.academicYear || '').toString().includes(q)
                );
            }
            if (filtered.length === 0) {
                classRoomDropdown.innerHTML = `<div class="no-results">${q ? 'Nenhuma turma encontrada' : 'Todas as turmas ativas j&aacute; foram selecionadas'}</div>`;
            } else {
                let html = '';
                if (filtered.length > 1) {
                    html += `<div class="dropdown-item select-all fw-bold text-primary" data-id="all" style="border-bottom: 1px solid #eee;">
                        <i class="bx bx-check-double me-1"></i> Selecionar todas as ${filtered.length} turmas
                    </div>`;
                }
                html += filtered.map(c => {
                    const shiftStr = c.shift ? " - " + translateShift(c.shift) : "";
                    const label = (c.name || ('Turma ' + c.id)) + shiftStr + ` (${c.academicYear || ''})`;
                    return `<div class="dropdown-item" data-id="${c.id}" data-label="${escapeHtml(label)}">
                        <i class="bx bx-plus text-secondary me-1"></i> ${escapeHtml(label)}
                    </div>`;
                }).join('');
                classRoomDropdown.innerHTML = html;
            }
            classRoomDropdown.classList.add('show');
        }

        function renderTags() {
            selectedClassRoomsContainer.innerHTML = selectedClassrooms.map(c => `
                <span class="selected-tag mb-1">
                    ${escapeHtml(c.label)}
                    <span class="remove-tag" data-id="${c.id}">&times;</span>
                </span>
            `).join('');
        }

        classRoomSearch.addEventListener('focus', () => renderDropdown(classRoomSearch.value));
        classRoomSearch.addEventListener('input', () => renderDropdown(classRoomSearch.value));
        classRoomSearch.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!classRoomDropdown.classList.contains('show')) {
                renderDropdown(classRoomSearch.value);
            }
        });

        document.addEventListener('click', (e) => {
            if (!classRoomSearchContainer.contains(e.target)) {
                classRoomDropdown.classList.remove('show');
            }
        });

        classRoomDropdown.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents document click from firing
            const item = e.target.closest('.dropdown-item');
            if (!item || item.classList.contains('disabled') || item.classList.contains('no-results')) return;
            
            if (item.dataset.id === 'all') {
                const q = (classRoomSearch.value || '').toLowerCase().trim();
                const available = allClassrooms.filter(c => !selectedClassrooms.some(s => s.id === c.id));
                let filtered = available;
                if (q) {
                    filtered = available.filter(c => 
                        (c.name || '').toLowerCase().includes(q) || 
                        translateShift(c.shift).toLowerCase().includes(q) ||
                        (c.academicYear || '').toString().includes(q)
                    );
                }
                filtered.forEach(c => {
                    if (!selectedClassrooms.some(s => s.id === c.id)) {
                        const shiftStr = c.shift ? " - " + translateShift(c.shift) : "";
                        const label = (c.name || ('Turma ' + c.id)) + shiftStr + ` (${c.academicYear || ''})`;
                        selectedClassrooms.push({id: c.id, label});
                    }
                });
            } else {
                const id = parseInt(item.dataset.id);
                const label = item.dataset.label;
                if (!isNaN(id) && !selectedClassrooms.some(s => s.id === id)) {
                    selectedClassrooms.push({id, label});
                }
            }
            
            classRoomSearch.value = '';
            renderTags();
            
            // Re-render and explicitly maintain focus and open state
            renderDropdown('');
            classRoomSearch.focus();
        });

        selectedClassRoomsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-tag')) {
                const id = parseInt(e.target.dataset.id);
                selectedClassrooms = selectedClassrooms.filter(c => c.id !== id);
                renderTags();
                if (classRoomDropdown.classList.contains('show')) {
                    renderDropdown(classRoomSearch.value);
                }
            }
        });

messageInput.addEventListener("input", function() {
            let val = this.value;
            if (val.length > 200) {
                this.value = val.slice(0, 200);
                val = this.value;
            }
            charCounter.textContent = `${val.length}/200 caracteres`;
            if (val.length >= 190) {
                charCounter.classList.add("text-danger");
            } else {
                charCounter.classList.remove("text-danger");
            }
        });

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            
            const selectedClassRooms = selectedClassrooms.map(c => c.id);
            if (selectedClassRooms.length === 0 && (!targetTeachers || !targetTeachers.checked)) {
                alertMessage.innerHTML = `<div class="alert alert-warning alert-dismissible" role="alert">
                    Selecione pelo menos uma turma destino.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
                submitBtn.disabled = false;
                submitSpinner.classList.add("d-none");
                return;
            }
            
            const payload = {
                title: document.getElementById("title").value,
                eventDate: document.getElementById("eventDate").value || null,
                message: document.getElementById("message").value.trim().replace(/(?:\r?\n\s*){2,}/g, '\n'),
                classRoomIds: (targetTeachers && targetTeachers.checked) ? [] : selectedClassRooms,
                targetTeachers: targetTeachers && targetTeachers.checked
            };

            submitBtn.disabled = true;
            submitSpinner.classList.remove("d-none");
            alertMessage.innerHTML = "";

            fetch("/api/announcements", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                submitBtn.disabled = false;
                submitSpinner.classList.add("d-none");
                
                if (response.ok) {
                    alertMessage.innerHTML = `<div class="alert alert-success alert-dismissible" role="alert">
                        Aviso publicado com sucesso!
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>`;
                    form.reset();
                    charCounter.textContent = "0/200 caracteres";
                    charCounter.classList.remove("text-danger");
                } else {
                    const err = await response.json().catch(() => ({message: "Erro ao publicar aviso."}));
                    throw new Error(err.message || "Erro ao publicar aviso.");
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitSpinner.classList.add("d-none");
                alertMessage.innerHTML = `<div class="alert alert-danger alert-dismissible" role="alert">
                    ${error.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
            });
        });
    });
</script>
</body>
</html>
