<!DOCTYPE html>
<html lang="pt-BR" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default"
      data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Edição de Período Acadêmico | Escola Web</title>
    <script src="/js/auth-guard.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=3"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/secretary-sidebar.html"></div>
        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-fluid flex-grow-1 container-p-y">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2"
                           href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>

                    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Períodos Acadêmicos /</span> Edição
                    </h4>

                    <div id="loadingFormState" class="text-center py-5 d-none">
                        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span>
                        </div>
                        <p class="mt-2 text-muted">Carregando dados do período...</p>
                    </div>
                    <div id="errorFormState" class="text-center py-5 d-none">
                        <i class="bx bx-error-circle fs-1 text-danger"></i>
                        <p class="mt-2 text-muted mb-0" id="errorFormMessage">Erro ao carregar.</p>
                        <a href="/principal/academic-periods.html" class="btn btn-outline-primary btn-sm mt-3"><i
                                class="bx bx-arrow-back me-1"></i> Voltar</a>
                    </div>

                    <div class="row" id="formWrapper">
                        <div class="col-12">
                            <div class="card mb-4">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">Dados do Período</h5>
                                    <small class="text-muted">* Campos obrigatórios</small>
                                </div>
                                <div class="card-body p-5">
                                    <form id="editForm">
                                        <input type="hidden" id="periodId"/>

                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label" for="academicYearId">Ano Acadêmico *</label>
                                                <select class="form-select" id="academicYearId" required>
                                                    <option value="" disabled selected>Carregando anos...</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label" for="name">Nome do Período *</label>
                                                <div class="input-group input-group-merge">
                                                    <span class="input-group-text"><i
                                                            class="bx bx-time-five"></i></span>
                                                    <input type="text" class="form-control" id="name" required
                                                           maxlength="100"
                                                           placeholder="Ex: 1º Bimestre"/>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label" for="startDate">Data de Início</label>
                                                <input type="date" class="form-control" id="startDate"/>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label" for="endDate">Data de Término</label>
                                                <input type="date" class="form-control" id="endDate"/>
                                            </div>
                                        </div>

                                        <div id="formMessage" class="mt-3 mb-3"></div>

                                        <div class="d-flex justify-content-end mt-4">
                                            <a href="/principal/academic-periods.html"
                                               class="btn btn-outline-secondary me-2 btn-lg">Cancelar</a>
                                            <button type="submit" class="btn btn-primary btn-lg" id="btnSubmit">Salvar
                                                Alterações
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-fluid d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">©
                            <script>document.write(new Date().getFullYear());</script>
                            EscolaWEB
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("editForm");
        const formWrapper = document.getElementById("formWrapper");
        const loadingState = document.getElementById("loadingFormState");
        const errorState = document.getElementById("errorFormState");
        const btnSubmit = document.getElementById("btnSubmit");
        const formMessage = document.getElementById("formMessage");
        const yearSelect = document.getElementById("academicYearId");
        const periodId = new URLSearchParams(window.location.search).get('id');

        if (!periodId) {
            formWrapper.classList.add('d-none');
            errorState.classList.remove('d-none');
            document.getElementById('errorFormMessage').innerText = "ID do período não fornecido na URL.";
            return;
        }

        const token = localStorage.getItem('jwt_token');

        async function loadYears() {
            try {
                const response = await fetch('/api/academic-years', {
                    headers: {'Authorization': 'Bearer ' + (token || '')}
                });
                if (response.ok) {
                    const years = await response.json();
                    yearSelect.innerHTML = '<option value="" disabled>Selecione o ano</option>';
                    years.sort((a, b) => b.year - a.year);
                    years.forEach(y => {
                        const label = y.active ? `${y.year} (Ativo)` : `${y.year}`;
                        yearSelect.innerHTML += `<option value="${y.id}">${label}</option>`;
                    });
                }
            } catch (e) {
                yearSelect.innerHTML = '<option value="" disabled selected>Erro ao carregar</option>';
            }
        }

        async function loadPeriodData() {
            formWrapper.classList.add('d-none');
            loadingState.classList.remove('d-none');
            errorState.classList.add('d-none');
            try {
                await loadYears();
                const response = await fetch(`/api/academic-periods/${periodId}`, {
                    headers: {'Authorization': 'Bearer ' + (token || '')}
                });
                if (!response.ok) {
                    if (response.status === 403) throw new Error("Acesso negado.");
                    throw new Error("Período não encontrado.");
                }
                const data = await response.json();

                if (data.closed) {
                    throw new Error("Este período está fechado e não pode ser editado.");
                }

                document.getElementById('periodId').value = data.id;
                document.getElementById('name').value = data.name;
                document.getElementById('startDate').value = data.startDate || '';
                document.getElementById('endDate').value = data.endDate || '';
                yearSelect.value = data.academicYearId;

                formWrapper.classList.remove('d-none');
            } catch (error) {
                errorState.classList.remove('d-none');
                document.getElementById('errorFormMessage').innerText = error.message;
            } finally {
                loadingState.classList.add('d-none');
            }
        }

        await loadPeriodData();

        if (!form) return;
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            formMessage.innerHTML = '';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Salvando...';

            const payload = {
                academicYearId: parseInt(yearSelect.value),
                name: document.getElementById('name').value,
                startDate: document.getElementById('startDate').value || null,
                endDate: document.getElementById('endDate').value || null
            };

            try {
                const response = await fetch(`/api/academic-periods/${periodId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '')},
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    formMessage.innerHTML = '<div class="alert alert-success alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">Período atualizado com sucesso!<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                } else {
                    let errorMsg = 'Erro ao atualizar.';
                    try {
                        const errorData = await response.json();
                        if (errorData.errors && Array.isArray(errorData.errors)) errorMsg = errorData.errors.map(err => err.defaultMessage || err.message).join('<br>');
                        else if (errorData.message) errorMsg = errorData.message;
                        else if (errorData.detail) errorMsg = errorData.detail;
                    } catch (_) {
                        if (response.status === 403) errorMsg = "Acesso negado: apenas a Direção pode editar períodos.";
                    }
                    formMessage.innerHTML = `<div class="alert alert-danger alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">${errorMsg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
                }
            } catch (error) {
                formMessage.innerHTML = '<div class="alert alert-danger alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">Erro de conexão.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Salvar Alterações';
            }
        });
    });
</script>
<script src="/js/load-sidebar.js"></script>
</body>
</html>
