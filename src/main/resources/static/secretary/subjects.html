<!DOCTYPE html>
<html
        lang="pt-BR"
        class="light-style layout-menu-fixed"
        dir="ltr"
        data-theme="theme-default"
        data-assets-path="/assets/"
        data-template="vertical-menu-template-free"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Lista de Matérias | Escola Web</title>

    <script src="/js/auth-guard.js"></script>

    <meta name="description" content="Listagem e gestão de matérias"/>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=3"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>

    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/secretary-sidebar.html"></div>

        <div class="layout-page">
            <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
                 id="layout-navbar">
                <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                    <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                        <i class="bx bx-menu bx-sm"></i>
                    </a>
                </div>
                <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                    <div class="navbar-nav align-items-center w-100">
                        <div class="nav-item d-flex align-items-center w-100" style="max-width: 500px;">
                            <i class="bx bx-search fs-4 lh-0 me-2 text-muted"></i>
                            <input type="text" class="form-control border-0 shadow-none px-0 w-100"
                                   placeholder="Buscar matéria por nome..."
                                   aria-label="Buscar matéria" id="globalSearch" style="min-width: 350px;"/>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold mb-0">
                            <span class="text-muted fw-light">Matérias /</span> Listagem
                        </h4>
                        <a href="/secretary/create/subject.html" class="btn btn-primary">
                            <i class="bx bx-plus me-1"></i> Cadastrar Matéria
                        </a>
                    </div>

                    <div class="card">
                        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-3">
                            <h5 class="mb-0">Matérias Cadastradas</h5>

                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="statusFilter" id="filterActive"
                                       value="active" checked/>
                                <label class="btn btn-outline-success btn-sm" for="filterActive">Ativas</label>

                                <input type="radio" class="btn-check" name="statusFilter" id="filterInactive"
                                       value="inactive"/>
                                <label class="btn btn-outline-danger btn-sm" for="filterInactive">Inativas</label>

                                <input type="radio" class="btn-check" name="statusFilter" id="filterAll" value="all"/>
                                <label class="btn btn-outline-primary btn-sm" for="filterAll">Todas</label>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th>Matéria</th>
                                    <th>Descrição</th>
                                    <th>Adicionada em</th>
                                    <th>Status</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                                </thead>
                                <tbody id="subjectsTableBody"></tbody>
                            </table>

                            <div id="loadingState" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <p class="mt-2 text-muted">Carregando matérias...</p>
                            </div>

                            <div id="emptyState" class="text-center py-5 d-none">
                                <i class="bx bx-book-open fs-1 text-muted"></i>
                                <p class="mt-2 text-muted mb-0">Nenhuma matéria encontrada.</p>
                                <a href="/secretary/create/subject.html" class="btn btn-primary btn-sm mt-3">
                                    <i class="bx bx-plus me-1"></i> Cadastrar matéria
                                </a>
                            </div>

                            <div id="errorState" class="text-center py-5 d-none">
                                <i class="bx bx-error-circle fs-1 text-danger"></i>
                                <p class="mt-2 text-muted mb-0" id="errorMessage">Erro ao carregar matérias.</p>
                                <button class="btn btn-outline-primary btn-sm mt-3" onclick="loadSubjects()">
                                    <i class="bx bx-refresh me-1"></i> Tentar novamente
                                </button>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <small class="text-muted" id="recordCount"></small>
                        </div>
                    </div>
                </div>

                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            ©
                            <script>document.write(new Date().getFullYear());</script>
                            EscolaWEB
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>

<script src="/js/load-sidebar.js"></script>

<script>
    let allSubjects = [];
    let statusFilter = 'active';
    let searchTerm = '';

    function getToken() {
        return localStorage.getItem('jwt_token') || '';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            const date = new Date(dateStr);
            return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        } catch (e) {
            return dateStr;
        }
    }

    function getInitials(name) {
        if (!name) return 'M';
        return name.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function truncate(str, max) {
        if (!str) return '—';
        return str.length > max ? str.substring(0, max) + '…' : str;
    }

    const avatarColors = ['bg-label-primary', 'bg-label-success', 'bg-label-info', 'bg-label-warning', 'bg-label-danger', 'bg-label-secondary'];

    function avatarColor(id) {
        return avatarColors[(id || 0) % avatarColors.length];
    }

    function handleUnauthorized() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '/login.html';
    }

    async function loadSubjects() {
        const tableBody = document.getElementById('subjectsTableBody');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const errorState = document.getElementById('errorState');

        tableBody.innerHTML = '';
        loadingState.classList.remove('d-none');
        emptyState.classList.add('d-none');
        errorState.classList.add('d-none');

        try {
            const response = await fetch('/api/subjects?activeOnly=false', {
                headers: {'Authorization': `Bearer ${getToken()}`}
            });

            if (response.status === 401 || response.status === 403) return handleUnauthorized();
            if (!response.ok) throw new Error('Erro na resposta do servidor');

            allSubjects = await response.json();
            applyFilters();
        } catch (error) {
            console.error(error);
            loadingState.classList.add('d-none');
            errorState.classList.remove('d-none');
        }
    }

    function applyFilters() {
        let filtered = allSubjects;

        if (statusFilter === 'active') filtered = filtered.filter(s => s.active);
        else if (statusFilter === 'inactive') filtered = filtered.filter(s => !s.active);

        if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase().trim();
            filtered = filtered.filter(s =>
                (s.name && s.name.toLowerCase().includes(term)) ||
                (s.description && s.description.toLowerCase().includes(term))
            );
        }

        if (statusFilter === 'all') {
            filtered.sort((a, b) => {
                if (a.active && !b.active) return -1;
                if (!a.active && b.active) return 1;
                return 0;
            });
        }

        renderTable(filtered);
    }

    function renderTable(subjects) {
        const tableBody = document.getElementById('subjectsTableBody');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const recordCount = document.getElementById('recordCount');

        loadingState.classList.add('d-none');

        if (subjects.length === 0) {
            tableBody.innerHTML = '';
            emptyState.classList.remove('d-none');
            recordCount.textContent = '0 registros';
            return;
        }

        emptyState.classList.add('d-none');
        recordCount.textContent = `${subjects.length} matéria${subjects.length !== 1 ? 's' : ''} listada${subjects.length !== 1 ? 's' : ''}`;

        tableBody.innerHTML = subjects.map(s => {
            const statusBadge = s.active
                ? '<span class="badge bg-label-success">Ativa</span>'
                : '<span class="badge bg-label-danger">Inativa</span>';

            const initial = getInitials(s.name);
            const colorClass = avatarColor(s.id);

            const toggleAction = s.active
                ? `<li><a class="dropdown-item" href="javascript:void(0);" onclick="toggleStatus(${s.id}, false)"><i class="bx bx-power-off me-1 text-warning"></i> Desativar</a></li>`
                : `<li><a class="dropdown-item" href="javascript:void(0);" onclick="toggleStatus(${s.id}, true)"><i class="bx bx-check-circle me-1 text-success"></i> Ativar</a></li>
                       <li><hr class="dropdown-divider"></li>
                       <li><a class="dropdown-item text-danger" href="javascript:void(0);" onclick="deleteSubject(${s.id})"><i class="bx bx-trash me-1"></i> Excluir do Sistema</a></li>`;

            return `
                    <tr class="${!s.active ? 'opacity-75 bg-lighter' : ''}">
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar avatar-sm me-3">
                                    <span class="avatar-initial rounded-circle ${colorClass}">${initial}</span>
                                </div>
                                <span class="fw-semibold text-heading">${escapeHtml(s.name)}</span>
                            </div>
                        </td>
                        <td><small class="text-muted">${escapeHtml(truncate(s.description, 60))}</small></td>
                        <td>${formatDate(s.createdAt)}</td>
                        <td>${statusBadge}</td>
                        <td class="text-center">
                            <div class="dropdown">
                                <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                                    <i class="bx bx-dots-vertical-rounded"></i>
                                </button>
                                <div class="dropdown-menu">
                                    ${s.active ? `<li><a class="dropdown-item" href="/secretary/edit/subject.html?id=${s.id}"><i class="bx bx-edit-alt me-1 text-primary"></i> Editar</a></li>` : ''}
                                    ${toggleAction}
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
        }).join('');
    }

    async function toggleStatus(id, activate) {
        const action = activate ? 'ativar' : 'desativar';
        if (!confirm(`Tem certeza que deseja ${action} esta matéria?`)) return;

        const endpoint = `/api/subjects/${id}/${activate ? 'activate' : 'deactivate'}`;
        try {
            const response = await fetch(endpoint, {
                method: 'PUT',
                headers: {'Authorization': `Bearer ${getToken()}`}
            });
            if (response.status === 401 || response.status === 403) return handleUnauthorized();
            if (response.ok) {
                loadSubjects();
            } else {
                const err = await response.json().catch(() => null);
                alert(`Erro ao ${action} matéria: ${err?.message || 'Erro desconhecido'}`);
            }
        } catch (error) {
            alert(`Erro de conexão ao tentar ${action} a matéria.`);
        }
    }

    async function deleteSubject(id) {
        if (!confirm('ATENÇÃO: Deseja realmente EXCLUIR DEFINITIVAMENTE esta matéria? Esta ação não pode ser desfeita.')) return;
        try {
            const response = await fetch(`/api/subjects/${id}`, {
                method: 'DELETE',
                headers: {'Authorization': `Bearer ${getToken()}`}
            });
            if (response.status === 401 || response.status === 403) return handleUnauthorized();
            if (response.ok) {
                loadSubjects();
            } else {
                const err = await response.json().catch(() => null);
                alert(`Erro ao excluir matéria: ${err?.message || 'Esta matéria está vinculada a alocações de professores e não pode ser excluída.'}`);
            }
        } catch (error) {
            alert('Erro de conexão ao tentar excluir a matéria.');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('input[name="statusFilter"]').forEach(r => {
            r.addEventListener('change', e => {
                statusFilter = e.target.value;
                applyFilters();
            });
        });
        document.getElementById('globalSearch').addEventListener('input', e => {
            searchTerm = e.target.value;
            applyFilters();
        });
        loadSubjects();
    });
</script>
</body>
</html>
