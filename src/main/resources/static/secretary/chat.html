<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Monitoramento de Chat | Secretaria | Escola Web</title>
    
    <script src="/js/auth-guard.js"></script>

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />

    <!-- Importando SockJS e STOMP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            background-color: #f5f5f9;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chat-header {
            background-color: #696cff;
            color: white;
            padding: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f5f5f9; 
        }
        .chat-message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            position: relative;
            font-size: 14px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .chat-message.sent {
            align-self: flex-end;
            background-color: #696cff;
            color: #ffffff;
            border-top-right-radius: 0;
        }
        .chat-message.received {
            align-self: flex-start;
            background-color: #ffffff;
            color: #566a7f;
            border-top-left-radius: 0;
        }
        .chat-message.received .author {
            font-size: 12px;
            font-weight: 600;
            color: #696cff;
            margin-bottom: 2px;
            display: block;
        }
        .chat-message.sent .author {
            display: none;
        }
        .chat-message .time {
            font-size: 11px;
            opacity: 0.8;
            text-align: right;
            display: block;
            margin-top: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #d9dee3;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d9dee3;
            outline: none;
            font-size: 14px;
            transition: border-color 0.15s ease-in-out;
        }
        .chat-input-area input:focus {
            border-color: #696cff;
        }
        .chat-input-area button {
            background-color: #696cff;
            color: white;
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-input-area button:hover {
            background-color: #5f61e6;
        }
    </style>
</head>
<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <div id="sidebar-container" data-sidebar="/components/secretary-sidebar.html"></div>

            <div class="layout-page">
                <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme shadow-sm" id="layout-navbar">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                        <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i>
                        </a>
                    </div>
                    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                        <div class="navbar-nav align-items-center w-100 d-none d-md-flex">
                            <span class="fs-4 fw-bold text-primary">Monitoramento de Chat</span>
                        </div>
                    </div>
                </nav>

                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        
                        <div class="chat-wrapper">
                            <div class="chat-header">
                                <div class="d-flex align-items-center gap-2">
                                    <i class='bx bxs-buildings fs-3'></i>
                                    <select id="classroomSelect" class="form-select form-select-sm" style="width: auto;">
                                        <option value="">Selecione uma turma...</option>
                                    </select>
                                </div>
                                <div>
                                    <span class="badge bg-label-warning text-dark">Modo Supervisão</span>
                                </div>
                            </div>
                            
                            <div class="chat-history" id="chatHistory">
                                <!-- As mensagens serão injetadas aqui pelo JavaScript -->
                            </div>
                            
                            <div class="chat-input-area">
                                <input type="text" id="messageInput" placeholder="Enviar mensagem institucional..." autocomplete="off" />
                                <button id="btnSend" type="button">
                                    <i class='bx bxs-send'></i>
                                </button>
                            </div>
                        </div>

                    </div>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>

    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <!-- Custom scripts -->
    <script src="/js/load-sidebar.js"></script>
    <script src="/js/chat.js"></script>

</body>
</html>
