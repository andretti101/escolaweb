<!-- Script de Integração com a API -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("studentRegistrationForm");
        const btnSubmit = document.getElementById("btnSubmit");
        const formMessage = document.getElementById("formMessage");

        if (!form) return;

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            formMessage.innerHTML = '';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Cadastrando...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                ownPhone: document.getElementById('ownPhone').value || null,
                guardianPhone: document.getElementById('guardianPhone').value || null,
                registrationNumber: document.getElementById('registrationNumber').value,
                birthDate: document.getElementById('birthDate').value
            };

            const token = localStorage.getItem('jwt_token');

            try {
                const response = await fetch('/api/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (token || '')
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    formMessage.innerHTML = '<div class="alert alert-success alert-dismissible" role="alert">Aluno cadastrado com sucesso!<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
                    form.reset();
                } else {
                    let errorMsg = 'Ocorreu um erro ao cadastrar o aluno.';
                    try {
                        const errorData = await response.json();
                        if (errorData.errors && Array.isArray(errorData.errors)) {
                            errorMsg = errorData.errors.map(err => err.defaultMessage || err.message).join('<br>');
                        } else if (errorData.message) {
                            errorMsg = errorData.message;
                        } else if (errorData.detail) {
                            errorMsg = errorData.detail;
                        }
                    } catch (parseError) {
                        if (response.status === 403) {
                            errorMsg = "Acesso negado: seu perfil não tem permissão para cadastrar alunos.";
                        } else if (response.status === 401) {
                            errorMsg = "Sessão expirada ou não autenticada. Faça login novamente.";
                        }
                    }
                    formMessage.innerHTML = `<div class="alert alert-danger alert-dismissible" role="alert">${errorMsg}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>`;
                }
            } catch (error) {
                formMessage.innerHTML = '<div class="alert alert-danger alert-dismissible" role="alert">Erro de conexão com o servidor.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Cadastrar Aluno';
            }
        });
    });
</script>
