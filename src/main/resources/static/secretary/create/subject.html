<!DOCTYPE html>
<html
        lang="pt-BR"
        class="light-style layout-menu-fixed"
        dir="ltr"
        data-theme="theme-default"
        data-assets-path="/assets/"
        data-template="vertical-menu-template-free"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>

    <title>Cadastro de Matéria | Escola Web</title>

    <script src="/js/auth-guard.js"></script>

    <meta name="description" content="Formulário de cadastro de matérias para o sistema escolar"/>

    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=3"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>

    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
</head>

<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

        <div id="sidebar-container" data-sidebar="/components/secretary-sidebar.html"></div>

        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-fluid flex-grow-1 container-p-y">

                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2"
                           href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>

                    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Matérias /</span> Cadastro</h4>

                    <div class="row">
                        <div class="col-12">
                            <div class="card mb-4">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">Dados da Matéria</h5>
                                    <small class="text-muted float-end">* Campos obrigatórios</small>
                                </div>

                                <div class="card-body p-5">
                                    <form id="subjectRegistrationForm">

                                        <div class="row">
                                            <div class="col-md-12 mb-3">
                                                <label class="form-label" for="name">Nome da Matéria *</label>
                                                <div class="input-group input-group-merge">
                                                    <span id="name-icon" class="input-group-text"><i
                                                            class="bx bx-book"></i></span>
                                                    <input type="text" class="form-control" id="name" name="name"
                                                           placeholder="Ex: Matemática"
                                                           aria-label="Nome da matéria"
                                                           aria-describedby="name-icon"
                                                           required maxlength="100"/>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-12 mb-3">
                                                <label class="form-label" for="description">Descrição</label>
                                                <textarea class="form-control" id="description" name="description"
                                                          rows="4"
                                                          placeholder="Descrição opcional sobre a matéria..."></textarea>
                                            </div>
                                        </div>

                                        <div id="formMessage" class="mt-3 mb-3"></div>

                                        <div class="d-flex justify-content-end mt-4">
                                            <button type="reset" class="btn btn-outline-secondary me-2 btn-lg">Limpar
                                            </button>
                                            <button type="submit" class="btn btn-primary btn-lg" id="btnSubmit">
                                                Cadastrar Matéria
                                            </button>
                                        </div>

                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-fluid d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            ©
                            <script>document.write(new Date().getFullYear());</script>
                            EscolaWEB
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("subjectRegistrationForm");
        const btnSubmit = document.getElementById("btnSubmit");
        const formMessage = document.getElementById("formMessage");

        if (!form) return;

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            formMessage.innerHTML = '';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Cadastrando...';

            const payload = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value || null
            };

            const token = localStorage.getItem('jwt_token');

            try {
                const response = await fetch('/api/subjects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (token || '')
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    formMessage.innerHTML = '<div class="alert alert-success alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">Matéria cadastrada com sucesso!<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
                    form.reset();
                } else {
                    let errorMsg = 'Ocorreu um erro ao cadastrar a matéria.';
                    try {
                        const errorData = await response.json();
                        if (errorData.errors && Array.isArray(errorData.errors)) {
                            errorMsg = errorData.errors.map(err => err.defaultMessage || err.message).join('<br>');
                        } else if (errorData.message) {
                            errorMsg = errorData.message;
                        } else if (errorData.detail) {
                            errorMsg = errorData.detail;
                        }
                    } catch (parseError) {
                        if (response.status === 403) errorMsg = "Acesso negado: seu perfil não tem permissão para cadastrar matérias.";
                        else if (response.status === 401) errorMsg = "Sessão expirada. Faça login novamente.";
                    }
                    formMessage.innerHTML = `<div class="alert alert-danger alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">${errorMsg}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>`;
                }
            } catch (error) {
                formMessage.innerHTML = '<div class="alert alert-danger alert-dismissible text-wrap text-break" style="word-break: break-word;" role="alert">Erro de conexão com o servidor.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Cadastrar Matéria';
            }
        });
    });
</script>

<script src="/js/load-sidebar.js"></script>

</body>
</html>
