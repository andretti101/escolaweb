<!DOCTYPE html>
<html lang="pt-BR" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default" data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Registrar Aula | Escola Web</title>
    <script src="/js/auth-guard.js"></script>
    <meta name="description" content="Registro de aulas e chamadas" />
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="/assets/css/demo.css" />
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <style>
        .attendance-radio:checked + label { border-color: var(--bs-primary); font-weight: bold; }
        .attendance-radio-present:checked + label { background-color: rgba(113, 221, 55, 0.1); color: #71dd37; border-color: #71dd37; }
        .attendance-radio-absent:checked + label { background-color: rgba(255, 62, 29, 0.1); color: #ff3e1d; border-color: #ff3e1d; }
        .attendance-radio-justified:checked + label { background-color: rgba(255, 171, 0, 0.1); color: #ffab00; border-color: #ffab00; }
    </style>
</head>
<body>
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <div id="sidebar-container" data-sidebar="/components/teacher-sidebar.html"></div>
            <div class="layout-page">
                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                            <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2" href="javascript:void(0)">
                                <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                            </a>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fw-bold mb-0"><span class="text-muted fw-light">Diário de Classe /</span> Registrar Aula</h4>
                            <a href="/teacher/lessons.html" class="btn btn-outline-secondary">
                                <i class="bx bx-arrow-back me-1"></i> Voltar
                            </a>
                        </div>

                        <div id="alertContainer"></div>

                        <div class="card mb-4">
                            <h5 class="card-header border-bottom">Dados da Aula</h5>
                            <div class="card-body mt-4">
                                <form id="lessonForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="tcsId" class="form-label">Turma / Matéria <span class="text-danger">*</span></label>
                                            <select id="tcsId" class="form-select" required>
                                                <option value="">Selecione uma turma...</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label for="lessonDate" class="form-label">Data da Aula <span class="text-danger">*</span></label>
                                            <input type="date" class="form-control" id="lessonDate" required />
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label for="lessonCount" class="form-label">Qtd. de Aulas <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" id="lessonCount" min="1" max="6" value="1" required />
                                            <div class="form-text">Multiplicador de faltas no dia.</div>
                                        </div>
                                        <div class="col-md-12 mb-3">
                                            <label for="content" class="form-label">Conteúdo Lecionado <span class="text-danger">*</span></label>
                                            <textarea class="form-control" id="content" rows="2" required></textarea>
                                        </div>
                                        <div class="col-md-12 mb-3">
                                            <label for="notes" class="form-label">Observações da Aula (Opcional)</label>
                                            <textarea class="form-control" id="notes" rows="1"></textarea>
                                        </div>
                                    </div>

                                    <!-- Lista de Chamada Section -->
                                    <div id="attendanceSection" class="mt-4 pt-4 border-top d-none">
                                        <h5 class="mb-3 d-flex align-items-center"><i class="bx bx-list-check me-2 text-primary"></i> Lista de Chamada</h5>
                                        <div class="table-responsive text-nowrap">
                                            <table class="table table-bordered table-hover">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th>Aluno</th>
                                                        <th class="text-center" style="width: 350px;">Status de Presença</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="studentsTableBody">
                                                    <!-- Students render here -->
                                                </tbody>
                                            </table>
                                        </div>
                                        <div id="studentsLoading" class="text-center py-4 d-none">
                                            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div>
                                            <p class="text-muted mt-2">Carregando alunos...</p>
                                        </div>
                                    </div>

                                    <div class="mt-4 text-end">
                                        <button type="submit" class="btn btn-primary" id="btnSave" disabled>
                                            <i class="bx bx-save me-1"></i> Salvar Aula e Chamada
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </div>
                    
                    <footer class="content-footer footer bg-footer-theme">
                        <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                            <div class="mb-2 mb-md-0">© <script>document.write(new Date().getFullYear());</script> EscolaWEB</div>
                        </div>
                    </footer>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        let myTcsList = [];
        let currentStudents = [];

        function getToken() { return localStorage.getItem('jwt_token') || ''; }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
            window.scrollTo(0,0);
        }

        async function loadTcs() {
            try {
                const res = await fetch('/api/teacher-class-subjects', { headers: { 'Authorization': `Bearer ${getToken()}` } });
                if (res.ok) {
                    myTcsList = await res.json();
                    const select = document.getElementById('tcsId');
                    myTcsList.forEach(tcs => {
                        const opt = document.createElement('option');
                        opt.value = tcs.id;
                        opt.textContent = `${tcs.classRoomName} - ${tcs.subjectName}`;
                        select.appendChild(opt);
                    });
                }
            } catch(e) { console.error(e); showAlert('Erro ao carregar turmas do professor', 'danger'); }
        }

        async function loadStudentsForTcs(tcsId) {
            const tcs = myTcsList.find(t => String(t.id) === String(tcsId));
            if (!tcs) return;

            const tbody = document.getElementById('studentsTableBody');
            const attendanceSection = document.getElementById('attendanceSection');
            const loading = document.getElementById('studentsLoading');
            const btnSave = document.getElementById('btnSave');
            
            tbody.innerHTML = '';
            attendanceSection.classList.remove('d-none');
            loading.classList.remove('d-none');
            btnSave.disabled = true;

            try {
                const res = await fetch(`/api/enrollments/classroom/${tcs.classRoomId}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
                if (res.ok) {
                    const enrollments = await res.json();
                    
                    // Converte os DTOs de matrícula para um array de alunos
                    currentStudents = enrollments.filter(e => e.active).map(e => ({ id: e.studentId, name: e.studentName }));
                    
                    if (currentStudents.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Nenhum aluno matriculado nesta turma.</td></tr>';
                    } else {
                        renderAttendanceTable(currentStudents);
                        btnSave.disabled = false;
                    }
                }
            } catch(e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Erro ao carregar alunos.</td></tr>';
            } finally {
                loading.classList.add('d-none');
            }
        }

        function renderAttendanceTable(students) {
            const tbody = document.getElementById('studentsTableBody');
            let html = '';
            students.forEach(s => {
                const safeName = s.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                html += `
                    <tr>
                        <td class="align-middle fw-semibold">${safeName}</td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <input type="radio" class="btn-check attendance-radio attendance-radio-present" name="attendance_${s.id}" id="present_${s.id}" value="PRESENT" checked autocomplete="off">
                                <label class="btn btn-outline-success btn-sm" for="present_${s.id}"><i class="bx bx-check me-1"></i> Presente</label>

                                <input type="radio" class="btn-check attendance-radio attendance-radio-absent" name="attendance_${s.id}" id="absent_${s.id}" value="ABSENT" autocomplete="off">
                                <label class="btn btn-outline-danger btn-sm" for="absent_${s.id}"><i class="bx bx-x me-1"></i> Falta</label>

                                <input type="radio" class="btn-check attendance-radio attendance-radio-justified" name="attendance_${s.id}" id="justified_${s.id}" value="JUSTIFIED" autocomplete="off">
                                <label class="btn btn-outline-warning btn-sm" for="justified_${s.id}"><i class="bx bx-info-circle me-1"></i> Justificada</label>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        document.getElementById('tcsId').addEventListener('change', (e) => {
            const tcsId = e.target.value;
            if (tcsId) {
                loadStudentsForTcs(tcsId);
            } else {
                document.getElementById('attendanceSection').classList.add('d-none');
                document.getElementById('btnSave').disabled = true;
            }
        });

        document.getElementById('lessonForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave');

            // Validação: garantir que todos os alunos possuem status de presença
            for (const student of currentStudents) {
                const selected = document.querySelector(`input[name="attendance_${student.id}"]:checked`);
                if (!selected) {
                    showAlert(`Aluno "${student.name}" não possui status de presença definido. Marque Presente, Falta ou Justificada para todos os alunos.`, 'danger');
                    return;
                }
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';
            
            try {
                // 1. Create Lesson
                const lessonPayload = {
                    lessonDate: document.getElementById('lessonDate').value,
                    content: document.getElementById('content').value,
                    notes: document.getElementById('notes').value,
                    teacherClassSubjectId: parseInt(document.getElementById('tcsId').value),
                    lessonCount: parseInt(document.getElementById('lessonCount').value)
                };

                const lessonRes = await fetch('/api/lessons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(lessonPayload)
                });

                if (!lessonRes.ok) {
                    const err = await lessonRes.json().catch(()=>null);
                    throw new Error(err?.message || 'Erro ao criar a aula.');
                }
                const lesson = await lessonRes.json();
                
                // 2. Register Attendances
                const attendancePromises = currentStudents.map(student => {
                    const status = document.querySelector(`input[name="attendance_${student.id}"]:checked`).value;
                    const attPayload = {
                        studentId: student.id,
                        lessonId: lesson.id,
                        status: status
                    };
                    return fetch('/api/attendances', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                        body: JSON.stringify(attPayload)
                    });
                });

                await Promise.all(attendancePromises);

                window.location.href = '/teacher/lessons.html?success=true';
            } catch(error) {
                showAlert(error.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bx bx-save me-1"></i> Salvar Aula e Chamada';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lessonDate').valueAsDate = new Date();
            loadTcs();
        });
    </script>
</body>
</html>
