                    <!-- Avisos Fixados --> <div id="fixed-section" style="display: none; margin-bottom: 3rem;"> <h5 class="fw-bold text-primary mb-3"><i class="bx bx-pin me-2"></i>Avisos Fixados</h5> <div class="row mb-5" id="fixed-container"></div> <hr class="my-5" /> </div> <div class="row" id="upcoming-container">

<script src="/assets/vendor/libs/jquery/jquery.js"></script>

<script src="/assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const token = localStorage.getItem("jwt_token");
    if (!token) {
        window.location.href = "/index.html";
        return;
    }
    
    const userId = parseInt(localStorage.getItem("user_id"));

    try {
        const url = window.location.pathname.includes('my-announcements') ? '/api/announcements/my-announcements' : '/api/announcements/my-teaching-classrooms';
        const response = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (!response.ok) { const text = await response.text(); throw new Error(`Status ${response.status}: ${text}`); }
        const announcements = await response.json();
        fetch('/api/announcements/mark-read', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(console.error);
        
        announcements.sort((a, b) => {
            if (!a.eventDate) return 1;
            if (!b.eventDate) return -1;
            return new Date(a.eventDate) - new Date(b.eventDate);
        });

        const today = new Date();
        today.setHours(0,0,0,0);

        const fixedList = [];
        const upcomingList = [];
        const pastList = [];
        announcements.forEach(a => {
            if (!a.eventDate) {
                fixedList.push(a);
                return;
            }
            const eDate = new Date(a.eventDate + "T00:00:00");
            const parsedDate = isNaN(eDate) ? new Date(a.eventDate) : eDate;
            if (parsedDate < today) pastList.push(a);
            else upcomingList.push(a);
        });

        const renderCards = (list, containerId) => {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="col-12"><p class="text-muted">Nenhum recado encontrado.</p></div>`;
                return;
            }

            list.forEach(item => {
                let borderClass = 'border-left-primary';
                const role = item.authorRole ? item.authorRole.toUpperCase() : '';
                if (role.includes('SECRETARIA') || role.includes('SECRETARY')) borderClass = 'border-left-success';
                else if (role.includes('DIRECAO') || role.includes('PRINCIPAL')) borderClass = 'border-left-warning';
                else if (role.includes('PROFESSOR') || role.includes('TEACHER')) borderClass = 'border-left-primary';

                let classNames = 'Todas as Turmas';
                if (item.targetTeachers) {
                    classNames = 'Professores';
                } else if (item.classRooms && item.classRooms.length > 0) {
                    classNames = item.classRooms.map(c => c.name).join(', ');
                }

                const eventDateStr = item.eventDate 
                    ? new Date(item.eventDate).toLocaleDateString('pt-BR') 
                    : 'Sem data';

                const canEdit = item.authorId === userId;
                const editButtonHtml = canEdit ? `<a href="/teacher/edit/announcement.html?id=${item.id}" class="btn btn-sm btn-icon btn-outline-primary" title="Editar"><i class="bx bx-pencil"></i></a> <a href="javascript:void(0);" onclick="deleteAnnouncement(${item.id})" class="btn btn-sm btn-icon btn-outline-danger ms-1" title="Excluir"><i class="bx bx-trash"></i></a>` : '';

                const cardHtml = `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card card-announcement h-100 ${borderClass}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title mb-0">${item.title}</h5>
                                    <div class="flex-shrink-0 text-nowrap ms-2">${editButtonHtml}</div>
                                </div>
                                <p class="card-text text-muted mb-2"><i class="bx bx-calendar-event me-1"></i> Data: ${eventDateStr}</p>
                                <p class="card-text mb-3" style="white-space: pre-wrap;">${(item.message || "").replace(/(?:\r?\n\s*){2,}/g, "\n")}</p>
                                <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                                    <small class="text-muted"><i class="bx bx-user me-1"></i> ${item.authorName || 'Desconhecido'}</small>
                                    <span class="badge bg-label-secondary text-wrap" style="max-width: 60%;"><i class="bx bx-group me-1"></i> ${classNames}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
                
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        };

        renderCards(upcomingList, 'upcoming-container'); const fixedSection = document.getElementById('fixed-section'); if (fixedList.length > 0) { fixedSection.style.display = 'block'; renderCards(fixedList, 'fixed-container'); } else { fixedSection.style.display = 'none'; }
        const pastSection = document.getElementById('past-section');
        if (pastList.length > 0) {
            pastSection.style.display = 'block';
            renderCards(pastList, 'past-container');
        } else {
            pastSection.style.display = 'none';
        }

    } catch (error) {
        console.error(error);
        document.getElementById('upcoming-container').innerHTML = `<div class="col-12"><div class="alert alert-danger">Erro ao carregar avisos.</div></div>`;
    }
});

function showConfirmModal(title, message, onConfirm) {
    let modalEl = document.getElementById('customConfirmModal');
    if (!modalEl) {
        const html = `
        <div class="modal fade" id="customConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="customConfirmModalTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="customConfirmModalMessage" style="white-space: pre-wrap;"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="customConfirmModalBtn">Excluir</button>
                    </div>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        modalEl = document.getElementById('customConfirmModal');
    }
    document.getElementById('customConfirmModalTitle').textContent = title;
    document.getElementById('customConfirmModalMessage').textContent = message;
    
    const confirmBtn = document.getElementById('customConfirmModalBtn');
    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    
    const modal = new bootstrap.Modal(modalEl);
    newBtn.addEventListener('click', () => {
        modal.hide();
        onConfirm();
    });
    modal.show();
}

window.deleteAnnouncement = function(id) {
    showConfirmModal("Excluir Aviso", "Tem certeza que deseja excluir este aviso? Esta ação não pode ser desfeita.", async () => {
        try {
            const token = localStorage.getItem("jwt_token");
            const response = await fetch('/api/announcements/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (response.ok) {
                window.location.reload();
            } else {
                alert("Erro ao excluir o aviso.");
            }
        } catch (e) {
            console.error(e);
            alert("Erro ao excluir o aviso.");
        }
    });
};
</script>
