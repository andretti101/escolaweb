error.validation=One or more required fields were not filled or contain invalid information. Please review the highlighted fields in the form and try again.
error.invalid.param=The selected or provided value is not valid for this operation. Please select a valid option and try again.
error.malformed.body=The submitted information could not be processed. Please refresh the page, fill in all required fields, and try again.
error.missing.param=The required field "{0}" is missing. Please fill it in and try again.
error.type.mismatch=The field "{0}" received an incompatible format. Please provide a valid value.
error.illegal.argument=One or more provided details are incomplete or out of allowed limits. Please review the information entered in the form and try again.
error.bad.credentials=Incorrect email or password. Please verify the credentials entered and try again.
error.disabled.account=This user account has been disabled. Please contact the school secretary to request reactivation.
error.access.denied=Your user account does not have permission to access or modify this feature. If needed, request access from the administration or school office.
error.entity.not.found=The item you tried to access was not found or has already been deleted from the system. Refresh the page to view the updated list.
error.route.not.found=The page or address you tried to access does not exist. Please return to the home page or use the navigation menu.
error.method.not.allowed=The requested action cannot be performed on this page. Please use the buttons and options available on the page.
error.unsupported.media.type=The submitted file format is not accepted by the system. Please upload a file in a supported format.
error.data.conflict=Could not save because another record already exists with these unique details. Please review the form fields.
error.enrollment.in.use=This enrollment number already belongs to another registered student. Please provide a different enrollment number.
error.email.in.use=This email is already registered to another user in the system. Please use a different email address.
error.subject.in.use=A subject with this same name is already registered. Please choose a different name for the subject.
error.classroom.in.use=A classroom with this same name is already registered for this academic year. Please choose a different name for the classroom.
error.academic.year.in.use=An academic year is already registered for this year. Please check the list of existing academic years.
error.foreign.key.conflict=Cannot delete this item because it has associated data linked to it (such as classrooms, enrollments, lessons, or grades). Remove or unlink those items before deleting.
error.internal.server=An unexpected system issue occurred. Please wait a moment and try again. If the issue persists, contact support.
error.student.not.found=The selected student was not found or has been deactivated. Please check the student list and try again.
error.teacher.not.found=The selected teacher was not found or has been deactivated. Please check the teacher list and try again.
error.principal.not.found=The selected principal was not found or has been removed. Please check the list and try again.
error.secretary.not.found=The selected secretary was not found or has been removed. Please check the list and try again.
error.unauthorized.operation=This operation is not permitted for your user role. If you believe this is an error, contact the school administrator.
error.illegal.state=The operation could not be completed because the current record has restrictions or pending requirements (such as closed period, inactive class, or existing links). Please check the data and try again.
