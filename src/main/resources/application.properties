# 1. APPLICATION & INTERNATIONALIZATION (i18n)
spring.application.name=escolaweb
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 2. EMBEDDED HTTP SERVER (TOMCAT)
server.port=${SERVER_PORT:80}

# 3. DATABASE CONNECTION (DATASOURCE - POSTGRESQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. DATABASE MIGRATIONS (FLYWAY)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration

# 5. SEED DATA INITIALIZATION (data.sql)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# 6. JPA / HIBERNATE (ORM)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 7. SQL QUERY LOGGING & DEBUGGING
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# 8. API DOCUMENTATION (SWAGGER / OPENAPI 3)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# 9. TEMPLATE ENGINE (THYMELEAF)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# 10. SECURITY & AUTHENTICATION (JWT)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# 11. DEVELOPMENT TOOLS (DEVTOOLS)
spring.devtools.restart.enabled=true

# 12. GLOBAL ERROR HANDLING & HTTP RESPONSES
server.error.include-message=always
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# 13. MAIL SERVICE (MAILTRAP / SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 14. PASSWORD RESET
password-reset.expiration=${PASSWORD_RESET_EXPIRATION:900000}
password-reset.base-url=${APP_URL:http://localhost}

# 15. GLOBAL SERVLET ENCODING
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 16. ARTIFICIAL INTELLIGENCE (SPRING AI - GOOGLE GEMINI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000
spring.ai.retry.retryable-exceptions=java.lang.RuntimeException,java.lang.Exception

# 17. JSON SERIALIZATION (JACKSON)
spring.jackson.serialization.write-dates-as-timestamps=false
