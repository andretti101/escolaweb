      data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>

    <meta name="description" content="Recados Arquivados - Auditoria e Histórico"/>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=5"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>

    <style>
        .card-announcement { border-radius: 12px; transition: box-shadow 0.3s ease-in-out; }
        .card-announcement:hover { box-shadow: 0 .25rem 1rem rgba(161,172,184,.45); }
        .border-left-primary { border-left: 4px solid #696cff !important; }
        .border-left-success { border-left: 4px solid #71dd37 !important; }
        .border-left-warning { border-left: 4px solid #ffab00 !important; }
        .border-left-secondary { border-left: 4px solid #8592a3 !important; }
    </style>
    <link rel="stylesheet" href="/assets/css/dark-mode.css" />
    <script src="/js/global-modals.js"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/secretary-sidebar.html"></div>
        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2" href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>
                    
                    <h4 class="fw-bold py-3 mb-4">
                        <span class="text-muted fw-light">Mural de Recados /</span> Recados Arquivados
                    </h4>

                    <div class="alert alert-secondary d-flex align-items-center mb-4" role="alert">
                        <i class="bx bx-archive fs-4 me-2 text-secondary"></i>
                        <div>
                            <strong>Arquivo Histórico de Recados:</strong> Esta tela exibe recados arquivados para consulta e auditoria permanente. O conteúdo é somente leitura.
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-3 mb-2 mb-md-0">
                            <select id="filterAcademicYear" class="form-select">
                                <option value="">Todos os Anos Letivos</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-2 mb-md-0">
                            <select id="filterAuthor" class="form-select">
                                <option value="">Todos os Autores</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-2 mb-md-0">
                            <select id="filterClassroom" class="form-select">
                                <option value="">Todas as Turmas</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="filterTarget" class="form-select">
                                <option value="">Todos os Destinatários</option>
                                <option value="false">Turmas</option>
                                <option value="true">Professores</option>
                            </select>
                        </div>
                    </div>

                    <div class="row" id="archived-container">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>
                    </div>

                    <div id="pagination-container" class="d-flex justify-content-center mt-4 mb-5"></div>

                </div>
                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-fluid d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            Copyright © 2026 EscolaWEB. Todos os direitos reservados.
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>
<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>
<script>
    let currentPage = 0;
    let totalPages = 1;
    const pageSize = 12;
    let allClassRooms = [];

    function renderClassroomOptions(selectedYearId) {
        const classroomSelect = document.getElementById('filterClassroom');
        if (!classroomSelect) return;
        
        const currentValue = classroomSelect.value;
        classroomSelect.innerHTML = '<option value="">Todas as Turmas</option>';
        
        let filtered = allClassRooms;
        if (selectedYearId) {
            filtered = allClassRooms.filter(c => String(c.academicYearId) === String(selectedYearId) || String(c.academicYear) === String(selectedYearId));
        }

        filtered.forEach(c => {
            let label = c.name || '';
            if (!selectedYearId && c.academicYear) label += ' (' + c.academicYear + ')';
            if (!c.active) label += ' [Inativa]';
            classroomSelect.insertAdjacentHTML('beforeend', '<option value="' + c.id + '">' + escapeHtml(label) + '</option>');
        });

        const exists = Array.from(classroomSelect.options).some(o => o.value === currentValue);
        if (currentValue && exists) {
            classroomSelect.value = currentValue;
        } else {
            classroomSelect.value = '';
        }
    }

    async function loadFilters() {
        const token = localStorage.getItem("jwt_token");
        try {
            const [yearsRes, teachersRes, principalsRes, secretariesRes, classRoomsRes] = await Promise.all([
                fetch('/api/academic-years?size=1000', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('/api/teachers?activeOnly=false&size=1000', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('/api/principals?activeOnly=false&size=1000', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('/api/secretaries?activeOnly=false&size=1000', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('/api/classrooms?activeOnly=false&size=1000', { headers: { 'Authorization': 'Bearer ' + token } })
            ]);

            if (yearsRes.ok) {
                const rawYears = await yearsRes.json();
                const years = Array.isArray(rawYears) ? rawYears : (rawYears?.content || []);
                if (years) years.sort((a, b) => (b.year || 0) - (a.year || 0));
                const yearSelect = document.getElementById('filterAcademicYear');
                if (yearSelect) {
                    yearSelect.innerHTML = '<option value="">Todos os Anos Letivos</option>';
                    years.forEach(y => {
                        let label = y.year + (y.active ? ' (Atual)' : '');
                        yearSelect.insertAdjacentHTML('beforeend', '<option value="' + y.id + '">' + escapeHtml(label) + '</option>');
                    });
                }
            }
            
            if (classRoomsRes.ok) {
                const rawCR = await classRoomsRes.json();
                allClassRooms = Array.isArray(rawCR) ? rawCR : (rawCR?.content || []);
                if (allClassRooms) allClassRooms.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                renderClassroomOptions('');
            }
            let allAuthors = [];
            if (teachersRes.ok) {
                const t = await teachersRes.json();
                allAuthors = allAuthors.concat(Array.isArray(t) ? t : (t?.content || []));
            }
            if (principalsRes.ok) {
                const p = await principalsRes.json();
                allAuthors = allAuthors.concat(Array.isArray(p) ? p : (p?.content || []));
            }
            if (secretariesRes.ok) {
                const s = await secretariesRes.json();
                allAuthors = allAuthors.concat(Array.isArray(s) ? s : (s?.content || []));
            }
            
            const uniqueAuthors = [];
            const seenIds = new Set();
            allAuthors.forEach(a => {
                if (!seenIds.has(a.id)) {
                    seenIds.add(a.id);
                    uniqueAuthors.push(a);
                }
            });
            
            uniqueAuthors.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            
            const authorSelect = document.getElementById('filterAuthor');
            if (authorSelect) {
                authorSelect.innerHTML = '<option value="">Todos os Autores</option>';
                uniqueAuthors.forEach(u => {
                    authorSelect.insertAdjacentHTML('beforeend', '<option value="' + u.id + '">' + escapeHtml(u.name) + '</option>');
                });
            }
        } catch (e) {
            console.error("Erro ao carregar filtros", e);
        }
    }

    async function fetchArchivedAnnouncements(page) {
        const token = localStorage.getItem("jwt_token");
        if (!token) {
            window.location.href = '/login.html';
            return;
        }
        
        const academicYearId = document.getElementById('filterAcademicYear')?.value || '';
        const authorId = document.getElementById('filterAuthor')?.value || '';
        const classRoomId = document.getElementById('filterClassroom')?.value || '';
        const targetTeachers = document.getElementById('filterTarget')?.value || '';
        
        let url = '/api/announcements/archived?page=' + page + '&size=' + pageSize;
        if (academicYearId) url += '&academicYearId=' + academicYearId;
        if (authorId) url += '&authorId=' + authorId;
        if (classRoomId) url += '&classRoomId=' + classRoomId;
        if (targetTeachers !== '') url += '&targetTeachers=' + targetTeachers;

        try {
            document.getElementById('archived-container').innerHTML =
                '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';
            
            const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
            if (!response.ok) throw new Error('Falha ao buscar recados arquivados');
            
            const pageData = await response.json();
            const announcements = pageData.content || [];
            
            currentPage = pageData.number;
            totalPages = pageData.totalPages;
            
            renderCards(announcements);
            renderPagination();
        } catch (error) {
            console.error(error);
            document.getElementById('archived-container').innerHTML =
                '<div class="col-12"><div class="alert alert-danger">Erro ao carregar recados arquivados.</div></div>';
        }
    }
    
    function renderPagination() {
        const pagContainer = document.getElementById('pagination-container');
        if (!pagContainer) return;
        
        if (totalPages <= 1) {
            pagContainer.innerHTML = '';
            return;
        }
        
        let html = '<nav aria-label="Page navigation"><ul class="pagination pagination-md">';
        
        html += '<li class="page-item ' + (currentPage === 0 ? 'disabled' : '') + '">';
        html += '<a class="page-link" href="javascript:void(0);" onclick="fetchArchivedAnnouncements(' + (currentPage - 1) + ')"><i class="tf-icon bx bx-chevron-left"></i></a></li>';
                 
        for (let i = 0; i < totalPages; i++) {
            html += '<li class="page-item ' + (i === currentPage ? 'active' : '') + '">';
            html += '<a class="page-link" href="javascript:void(0);" onclick="fetchArchivedAnnouncements(' + i + ')">' + (i + 1) + '</a></li>';
        }
        
        html += '<li class="page-item ' + (currentPage === totalPages - 1 ? 'disabled' : '') + '">';
        html += '<a class="page-link" href="javascript:void(0);" onclick="fetchArchivedAnnouncements(' + (currentPage + 1) + ')"><i class="tf-icon bx bx-chevron-right"></i></a></li>';
                 
        html += '</ul></nav>';
        pagContainer.innerHTML = html;
    }

    function renderCards(list) {
        const container = document.getElementById('archived-container');
        container.innerHTML = '';
        if (list.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5"><i class="bx bx-archive fs-1 text-muted mb-2"></i><p class="text-muted">Nenhum recado arquivado encontrado.</p></div>';
            return;
        }

        let htmlString = '';
        list.forEach(item => {
            let borderClass = 'border-left-secondary';
            const role = item.authorRole ? item.authorRole.toUpperCase() : '';
            if (role.includes('SECRETARIA') || role.includes('SECRETARY')) borderClass = 'border-left-success';
            else if (role.includes('DIRECAO') || role.includes('PRINCIPAL')) borderClass = 'border-left-warning';
            else if (role.includes('PROFESSOR') || role.includes('TEACHER')) borderClass = 'border-left-primary';

            let classNames = 'Todas as Turmas';
            if (item.targetTeachers) {
                classNames = 'Professores';
            } else if (item.classRooms && item.classRooms.length > 0) {
                classNames = item.classRooms.map(c => c.name).join(', ');
            }

            const eventDateStr = item.eventDate 
                ? new Date(item.eventDate + "T00:00:00").toLocaleDateString('pt-BR') 
                : 'Sem data';

            const createdDateStr = item.createdAt 
                ? new Date(item.createdAt).toLocaleDateString('pt-BR') 
                : '';

            htmlString += '<div class="col-md-6 col-lg-4 mb-4">' +
                    '<div class="card card-announcement h-100 ' + borderClass + '">' +
                        '<div class="card-body d-flex flex-column">' +
                            '<div class="d-flex justify-content-between align-items-start mb-2">' +
                                '<h5 class="card-title mb-0">' + escapeHtml(item.title) + '</h5>' +
                                '<span class="badge bg-label-secondary ms-2 text-nowrap"><i class="bx bx-archive me-1"></i>Arquivado</span>' +
                            '</div>' +
                            '<div class="d-flex gap-3 text-muted small mb-2">' +
                                '<span><i class="bx bx-calendar-event me-1"></i> ' + eventDateStr + '</span>' +
                                (createdDateStr ? '<span><i class="bx bx-time me-1"></i> Criado: ' + createdDateStr + '</span>' : '') +
                            '</div>' +
                            '<p class="card-text mb-3" style="white-space: pre-wrap;">' + escapeHtml((item.message || "").replace(/(?:\r?\n\s*){2,}/g, "\n")) + '</p>' +
                            '<div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">' +
                                '<small class="text-muted"><i class="bx bx-user me-1"></i> ' + escapeHtml(item.authorName || 'Desconhecido') + '</small>' +
                                '<span class="badge bg-label-primary text-wrap" style="max-width: 60%;"><i class="bx bx-group me-1"></i> ' + escapeHtml(classNames) + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        });
        container.innerHTML = htmlString;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.toString().replace(/[&<>"']/g, m => map[m]);
    }

    window.fetchArchivedAnnouncements = fetchArchivedAnnouncements;

    function init() {
        loadFilters().then(() => fetchArchivedAnnouncements(0));
        
        const yearSelect = document.getElementById('filterAcademicYear');
        const authorSelect = document.getElementById('filterAuthor');
        const classroomSelect = document.getElementById('filterClassroom');
        const targetSelect = document.getElementById('filterTarget');
        
        if (yearSelect) {
            yearSelect.addEventListener('change', () => {
                renderClassroomOptions(yearSelect.value);
                fetchArchivedAnnouncements(0);
            });
        }
        if (authorSelect) authorSelect.addEventListener('change', () => fetchArchivedAnnouncements(0));
        if (classroomSelect) classroomSelect.addEventListener('change', () => fetchArchivedAnnouncements(0));
        if (targetSelect) {
            targetSelect.addEventListener('change', () => {
                if (targetSelect.value === 'true') {
                    if (classroomSelect) {
                        classroomSelect.value = '';
                        classroomSelect.disabled = true;
                    }
                } else {
                    if (classroomSelect) {
                        classroomSelect.disabled = false;
                    }
                }
                fetchArchivedAnnouncements(0);
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
<script src="/js/load-sidebar.js"></script>
</body>
