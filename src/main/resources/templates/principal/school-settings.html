<!DOCTYPE html>
<html lang="pt-BR" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default"
      data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Configurações da Escola | Escola Web</title>

    <script src="/js/auth-guard.js"></script>

    <meta name="description" content="Configurações gerais da escola"/>
    

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet"/>

    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/demo.css"/>
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>

    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css" />
<script src="/js/global-modals.js"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div id="sidebar-container" data-sidebar="/components/principal-sidebar.html"></div>

        <div class="layout-page">
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none mb-3">
                        <a class="nav-item nav-link px-0 me-xl-4 bg-white rounded shadow-sm p-2"
                           href="javascript:void(0)">
                            <i class="bx bx-menu bx-sm"></i> <span class="ms-1 fw-bold">Menu</span>
                        </a>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold mb-0">
                            <span class="text-muted fw-light">Administração /</span> Configurações da Escola
                        </h4>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="card mb-4">
                                <h5 class="card-header border-bottom">Informações Gerais</h5>

                                <div class="card-body mt-4">
                                    <div id="alertContainer"></div>

                                    <form id="settingsForm">
                                        <div class="row">
                                            <!-- Informações da Instituição -->
                                            <div class="col-md-6 mb-3">
                                                <label for="schoolName" class="form-label">Nome da Escola <span
                                                        class="text-danger">*</span></label>
                                                <input type="text" class="form-control" id="schoolName"
                                                       name="schoolName" maxlength="150" required
                                                       placeholder="Ex: Escola Estadual Machado de Assis"/>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="email" class="form-label">E-mail de Contato <span
                                                        class="text-danger">*</span></label>
                                                <input type="email" class="form-control" id="email" name="email"
                                                       maxlength="150" required placeholder="contato@escola.com"/>
                                            </div>

                                            <div class="col-md-6 mb-3">
                                                <label for="phone" class="form-label">Telefone</label>
                                                <input type="text" class="form-control" id="phone" name="phone"
                                                       maxlength="20" placeholder="(11) 99999-9999"/>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="cep" class="form-label">CEP</label>
                                                <div class="input-group">
                                                    <input type="text" class="form-control" id="cep" name="cep"
                                                           maxlength="9" placeholder="00000-000"/>
                                                    <button class="btn btn-outline-primary" type="button" id="btnBuscarCep" title="Buscar endereço pelo CEP">
                                                        <i class="bx bx-search me-1"></i> Buscar
                                                    </button>
                                                </div>
                                                <div id="cepFeedback" class="form-text mt-1" style="min-height: 18px;"></div>
                                            </div>

                                            <div class="col-md-12 mb-3">
                                                <label for="address" class="form-label">Endereço Completo</label>
                                                <input type="text" class="form-control" id="address" name="address"
                                                       maxlength="255" placeholder="Rua das Flores, 123 - Centro, Cidade - UF"/>
                                            </div>

                                            <!-- Localização no Mapa -->
                                            <div class="col-12 mt-2 mb-3">
                                                <div class="d-flex justify-content-between align-items-center mb-2">
                                                    <label class="form-label mb-0 fw-semibold">
                                                        <i class="bx bx-map-pin me-1 text-primary"></i> Localização da Escola no Mapa
                                                    </label>
                                                    <a id="btnOpenMaps" href="javascript:void(0)" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary d-none">
                                                        <i class="bx bx-link-external me-1"></i> Abrir no Google Maps
                                                    </a>
                                                </div>
                                                <div id="mapPlaceholder" class="p-4 text-center border rounded bg-lighter text-muted">
                                                    <i class="bx bx-map fs-2 d-block mb-1 text-secondary"></i>
                                                    <span class="small">Informe o CEP ou endereço para visualizar a localização da escola no mapa.</span>
                                                </div>
                                                <div id="mapContainer" class="d-none">
                                                    <div class="rounded overflow-hidden shadow-sm border" style="height: 320px;">
                                                        <iframe id="schoolMapIframe" width="100%" height="100%" style="border:0;" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src="about:blank"></iframe>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="col-12 mt-4 mb-3 border-top pt-4">
                                                <h6 class="fw-bold"><i class="bx bx-book-bookmark me-2"></i> Parâmetros
                                                    Acadêmicos</h6>
                                            </div>



                                            <div class="col-md-6 mb-3">
                                                <label for="minimumGrade" class="form-label">Média Mínima para Aprovação
                                                    <span class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <input type="number" disabled class="form-control" id="minimumGrade" min="0"
                                                           max="10" step="0.1" required/>
                                                    <span class="input-group-text">/ 10</span>
                                                </div>
                                            </div>

                                            <div class="col-md-6 mb-3">
                                                <label for="minimumAttendance" class="form-label">Frequência Mínima (%)
                                                    <span class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <input type="number" disabled class="form-control" id="minimumAttendance"
                                                           min="0" max="100" step="0.01" required/>
                                                    <span class="input-group-text">%</span>
                                                </div>
                                            </div>

                                        </div>
                                        <div class="mt-4 border-top pt-3 text-end">
                                            <button type="submit" class="btn btn-primary" id="btnSalvar">
                                                <i class="bx bx-save me-1"></i> Salvar Configurações
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                                Copyright © 2026 EscolaWEB. Todos os direitos reservados.
                            </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<script src="/assets/vendor/libs/jquery/jquery.js"></script>
<script src="/assets/vendor/libs/popper/popper.js"></script>
<script src="/assets/vendor/js/bootstrap.js"></script>
<script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="/assets/vendor/js/menu.js"></script>
<script src="/assets/js/main.js"></script>

<script src="/js/load-sidebar.js"></script>

<script>
    function getToken() {
        return localStorage.getItem('jwt_token') || '';
    }

    function showAlert(message, type) {
        const container = document.getElementById('alertContainer');
        container.innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
        window.scrollTo(0, 0);
    }

    function formatCep(value) {
        const digits = (value || '').replace(/\D/g, '').slice(0, 8);
        if (digits.length > 5) {
            return `${digits.slice(0, 5)}-${digits.slice(5)}`;
        }
        return digits;
    }

    function showCepFeedback(message, className) {
        const feedback = document.getElementById('cepFeedback');
        if (feedback) {
            feedback.className = `form-text mt-1 ${className || ''}`;
            feedback.textContent = message;
        }
    }

    let mapDebounceTimer = null;
    function scheduleMapUpdate(address, cep, delay = 400) {
        if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
        mapDebounceTimer = setTimeout(() => {
            updateMap(address, cep);
        }, delay);
    }

    function updateMap(address, cep) {
        const mapContainer = document.getElementById('mapContainer');
        const mapPlaceholder = document.getElementById('mapPlaceholder');
        const mapIframe = document.getElementById('schoolMapIframe');
        const btnOpenMaps = document.getElementById('btnOpenMaps');

        const addrClean = (address || '').trim();
        const cepClean = (cep || '').replace(/\D/g, '').trim();

        if (!addrClean && !cepClean) {
            if (mapContainer) mapContainer.classList.add('d-none');
            if (mapPlaceholder) mapPlaceholder.classList.remove('d-none');
            if (btnOpenMaps) btnOpenMaps.classList.add('d-none');
            if (mapIframe) {
                mapIframe.removeAttribute('data-last-query');
                mapIframe.src = 'about:blank';
            }
            return;
        }

        let query = '';
        if (addrClean && cepClean) {
            const formatted = formatCep(cepClean);
            if (addrClean.includes(formatted) || addrClean.includes(cepClean)) {
                query = addrClean;
            } else {
                query = `${addrClean}, ${formatted}`;
            }
        } else if (addrClean) {
            query = addrClean;
        } else {
            query = `CEP ${formatCep(cepClean)}`;
        }

        if (!query.toLowerCase().includes('brasil') && !query.toLowerCase().includes('brazil')) {
            query += ', Brasil';
        }

        const encoded = encodeURIComponent(query);
        const embedUrl = `https://www.google.com/maps/embed?origin=mfe&pb=!1m2!2m1!1s${encoded}`;
        const directUrl = `https://www.google.com/maps/search/?api=1&query=${encoded}`;

        if (mapIframe) {
            if (mapIframe.getAttribute('data-last-query') !== query) {
                mapIframe.setAttribute('data-last-query', query);
                mapIframe.src = embedUrl;
            }
        }
        if (btnOpenMaps) {
            btnOpenMaps.href = directUrl;
            btnOpenMaps.classList.remove('d-none');
        }
        if (mapPlaceholder) mapPlaceholder.classList.add('d-none');
        if (mapContainer) mapContainer.classList.remove('d-none');
    }

    let lastSearchedCep = '';
    async function buscarCep(auto = false) {
        const cepInput = document.getElementById('cep');
        const rawCep = (cepInput.value || '').replace(/\D/g, '');

        if (!rawCep) {
            if (!auto) showCepFeedback('Informe o CEP para pesquisar.', 'text-warning');
            return;
        }

        if (rawCep.length !== 8) {
            if (!auto) showCepFeedback('O CEP deve conter 8 dígitos.', 'text-danger');
            return;
        }

        if (auto && rawCep === lastSearchedCep) {
            return;
        }

        const btn = document.getElementById('btnBuscarCep');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Buscando...';
        }
        showCepFeedback('Buscando endereço pelo CEP...', 'text-muted');

        let data = null;

        function createTimeoutSignal(ms) {
            if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
                return AbortSignal.timeout(ms);
            }
            const controller = new AbortController();
            setTimeout(() => controller.abort(), ms);
            return controller.signal;
        }

        // 1. Try ViaCEP
        try {
            const resp = await fetch(`https://viacep.com.br/ws/${rawCep}/json/`, {
                signal: createTimeoutSignal(5000)
            });
            if (resp.ok) {
                const resJson = await resp.json();
                if (resJson && resJson.erro !== true && resJson.erro !== 'true') {
                    data = {
                        street: resJson.logradouro || '',
                        neighborhood: resJson.bairro || '',
                        city: resJson.localidade || '',
                        state: resJson.uf || ''
                    };
                }
            }
        } catch (e) {
            console.warn('ViaCEP falhou, tentando fallback BrasilAPI:', e);
        }

        // 2. Fallback to BrasilAPI
        if (!data) {
            try {
                const resp = await fetch(`https://brasilapi.com.br/api/cep/v1/${rawCep}`, {
                    signal: createTimeoutSignal(5000)
                });
                if (resp.ok) {
                    const resJson = await resp.json();
                    if (resJson && !resJson.errors) {
                        data = {
                            street: resJson.street || '',
                            neighborhood: resJson.neighborhood || '',
                            city: resJson.city || '',
                            state: resJson.state || ''
                        };
                    }
                }
            } catch (e) {
                console.warn('BrasilAPI falhou:', e);
            }
        }

        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bx bx-search me-1"></i> Buscar';
        }

        lastSearchedCep = rawCep;

        if (!data) {
            showCepFeedback('CEP não encontrado.', 'text-danger');
            return;
        }

        const addressInput = document.getElementById('address');
        let numberPart = '';
        const currentAddr = (addressInput.value || '').trim();
        if (currentAddr) {
            const numMatch = currentAddr.match(/,\s*(\d+[^\-,]*)/);
            if (numMatch) {
                numberPart = numMatch[1].trim();
            }
        }

        const parts = [];
        if (data.street) {
            parts.push(numberPart ? `${data.street}, ${numberPart}` : data.street);
        }
        if (data.neighborhood) parts.push(data.neighborhood);
        if (data.city && data.state) parts.push(`${data.city} - ${data.state}`);
        else if (data.city) parts.push(data.city);

        const composed = parts.join(', ');
        if (composed) {
            addressInput.value = composed;
            if (numberPart) {
                showCepFeedback('Endereço atualizado com sucesso!', 'text-success');
            } else {
                showCepFeedback('Endereço preenchido! Complete com o número da escola se necessário.', 'text-success');
            }
            if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
            updateMap(composed, rawCep);
            addressInput.focus();
        } else {
            showCepFeedback('CEP localizado.', 'text-info');
            if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
            updateMap(addressInput.value, rawCep);
        }
    }

    async function loadSettings() {
        try {
            const response = await fetch('/api/school-settings', {
                headers: {'Authorization': `Bearer ${getToken()}`}
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('schoolName').value = data.schoolName || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('cep').value = formatCep(data.cep || '');
                lastSearchedCep = (data.cep || '').replace(/\D/g, '');
                document.getElementById('address').value = data.address || '';
                document.getElementById('minimumGrade').value = data.minimumGrade || '6.0';
                document.getElementById('minimumAttendance').value = data.minimumAttendance || '70.00';
                if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
                updateMap(data.address, data.cep);
            } else if (response.status === 404) {
                // Settings not initialized yet, that's fine, show empty defaults
            } else {
                showAlert('Erro ao carregar configurações atuais.', 'danger');
            }
        } catch (error) {
            showAlert('Erro de conexão com o servidor.', 'danger');
        }
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';

        const payload = {
            schoolName: document.getElementById('schoolName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            cep: document.getElementById('cep').value.trim(),
            address: document.getElementById('address').value.trim(),
            minimumGrade: parseFloat(document.getElementById('minimumGrade').value),
            minimumAttendance: parseFloat(document.getElementById('minimumAttendance').value)
        };

        try {
            const response = await fetch('/api/school-settings', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getToken()}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showAlert('Configurações atualizadas com sucesso!', 'success');
                if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
                updateMap(payload.address, payload.cep);
            } else {
                const err = await response.json().catch(() => null);
                let errMsg = 'Erro ao salvar as configurações.';
                if (window.extractErrorMessage) {
                    errMsg = window.extractErrorMessage(err, errMsg);
                } else if (err?.errors) {
                    const msgs = Object.values(err.errors).flat();
                    if (msgs.length) errMsg = msgs.join('<br>');
                } else if (err?.message) {
                    errMsg = err.message;
                }
                showAlert(errMsg, 'danger');
            }
        } catch (error) {
            showAlert('Erro de conexão ao tentar salvar.', 'danger');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bx bx-save me-1"></i> Salvar Configurações';
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const cepInput = document.getElementById('cep');
        const addressInput = document.getElementById('address');

        cepInput.addEventListener('input', (e) => {
            e.target.value = formatCep(e.target.value);
            const raw = e.target.value.replace(/\D/g, '');
            if (raw.length === 8) {
                buscarCep(true);
            }
        });
        cepInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarCep(false);
            }
        });
        cepInput.addEventListener('blur', () => {
            const raw = cepInput.value.replace(/\D/g, '');
            if (raw.length === 8 && !addressInput.value.trim()) {
                buscarCep(true);
            }
        });
        document.getElementById('btnBuscarCep').addEventListener('click', () => {
            buscarCep(false);
        });
        addressInput.addEventListener('input', () => {
            scheduleMapUpdate(addressInput.value, cepInput.value, 400);
        });
        addressInput.addEventListener('blur', () => {
            if (mapDebounceTimer) clearTimeout(mapDebounceTimer);
            updateMap(addressInput.value, cepInput.value);
        });

        loadSettings();
    });
</script>
</body>
</html>
