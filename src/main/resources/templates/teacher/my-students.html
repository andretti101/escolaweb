    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>

    <script>
        const jwtToken = localStorage.getItem('jwt_token');
        const teacherId = localStorage.getItem('user_id');
        let teacherClassSubjects = [];

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        async function init() {
            if (!jwtToken || !teacherId) return;

            const userName = localStorage.getItem('user_name');
            if (userName) {
                const initial = userName.charAt(0).toUpperCase();
                const elInit = document.getElementById('dropdownAvatarInitial');
                const elInner = document.getElementById('dropdownAvatarInitialInner');
                const elName = document.getElementById('dropdownUserName');
                if (elInit) elInit.textContent = initial;
                if (elInner) elInner.textContent = initial;
                if (elName) elName.textContent = userName;
            }

            try {
                const res = await fetch(`/api/teacher-class-subjects/teacher/${teacherId}`, {
                    headers: {'Authorization': `Bearer ${jwtToken}`}
                });
                if (res.ok) {
                    teacherClassSubjects = await res.json();
                    teacherClassSubjects = teacherClassSubjects.filter(t => t.active);
                    teacherClassSubjects.sort((a, b) => (a.classRoomName || '').localeCompare(b.classRoomName || ''));
                    const select = document.getElementById('tcsSelect');
                    select.innerHTML = '<option value="">Selecione...</option>';
                    teacherClassSubjects.forEach(tcs => {
                        const opt = document.createElement('option');
                        opt.value = tcs.id;
                        opt.textContent = `${tcs.classRoomName} - ${tcs.subjectName}`;
                        select.appendChild(opt);
                    });
                    
                    select.addEventListener('change', (e) => {
                        if (e.target.value) {
                            loadStudentsPerformance(parseInt(e.target.value));
                        } else {
                            document.getElementById('studentsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Selecione uma turma acima.</td></tr>';
                            document.getElementById('studentsCount').textContent = '';
                        }
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadStudentsPerformance(tcsId) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted">Carregando desempenho...</div></td></tr>';
            
            const tcs = teacherClassSubjects.find(t => t.id === tcsId);
            if (!tcs) return;

            try {
                const enrollmentsRes = await fetch(`/api/enrollments/classroom/${tcs.classRoomId}`, {
                    headers: {'Authorization': `Bearer ${jwtToken}`}
                });
                let enrollments = await enrollmentsRes.json();
                enrollments = enrollments.filter(e => e.active);
                enrollments.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || ''));
                
                if (enrollments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Nenhum aluno ativo nesta turma.</td></tr>';
                    document.getElementById('studentsCount').textContent = '0 alunos';
                    return;
                }

                const promises = enrollments.map(async (enr) => {
                    const studentId = enr.studentId;
                    
                    const gradesRes = await fetch(`/api/grades/student/${studentId}`, { headers: {'Authorization': `Bearer ${jwtToken}`} });
                    let grades = gradesRes.ok ? await gradesRes.json() : [];
                    grades = grades.filter(g => g.tcsId === tcsId);
                    
                    const attRes = await fetch(`/api/attendances/student/${studentId}`, { headers: {'Authorization': `Bearer ${jwtToken}`} });
                    let attendances = attRes.ok ? await attRes.json() : [];
                    attendances = attendances.filter(a => a.tcsId === tcsId);

                    let presences = 0;
                    let absences = 0;
                    let justified = 0;
                    
                    attendances.forEach(a => {
                        const val = a.lessonCount || 1;
                        if (a.status === 'PRESENT') presences += val;
                        else if (a.status === 'ABSENT') absences += val;
                        else if (a.status === 'JUSTIFIED_ABSENCE' || a.status === 'EXCUSED') justified += val;
                    });
                    
                    // Filter grades ignoring null grades
                    const validGrades = grades.filter(g => (g.effectiveValue != null || g.value != null || g.recoveryValue != null));

                    const groupedGrades = {};
                    validGrades.forEach(g => {
                        const pName = g.periodName || 'Sem Período';
                        if (!groupedGrades[pName]) groupedGrades[pName] = [];
                        groupedGrades[pName].push(g);
                    });

                    // Compute average per period and then overall average
                    let avg = '-';
                    const periodNames = Object.keys(groupedGrades);
                    if (periodNames.length > 0) {
                        let sumOfPeriodAvgs = 0;
                        periodNames.forEach(pName => {
                            const pGrades = groupedGrades[pName];
                            let pSum = 0;
                            pGrades.forEach(g => {
                                const eff = g.effectiveValue != null ? Number(g.effectiveValue) : (g.recoveryValue != null ? Number(g.recoveryValue) : Number(g.value));
                                pSum += eff;
                            });
                            sumOfPeriodAvgs += (pSum / pGrades.length);
                        });
                        avg = (sumOfPeriodAvgs / periodNames.length).toFixed(2);
                    }
                    
                    let gradesListHtml = '';
                    if (validGrades.length === 0) {
                        gradesListHtml = '<span class="text-muted small">Sem notas</span>';
                    } else {
                        for (const pName in groupedGrades) {
                            const periodGrades = groupedGrades[pName];
                            const badgesHtml = periodGrades.map(g => {
                                const eff = g.effectiveValue != null ? Number(g.effectiveValue) : (g.recoveryValue != null ? Number(g.recoveryValue) : Number(g.value));
                                const firstGradeLabel = g.value != null
                                    ? Number(g.value).toFixed(2)
                                    : (g.effectiveValue != null
                                        ? Number(g.effectiveValue).toFixed(2)
                                        : (g.recoveryValue != null ? Number(g.recoveryValue).toFixed(2) : '-'));
                                const detailTitle = g.recoveryValue != null
                                    ? `${g.assessmentTitle} (1ª Nota: ${firstGradeLabel} | Rec: ${Number(g.recoveryValue).toFixed(2)})`
                                    : g.assessmentTitle;
                                return `<span class="badge bg-label-primary grade-badge-sm me-1 mb-1" title="${escapeHtml(detailTitle)}">${eff.toFixed(2)}</span>`;
                            }).join('');
                            gradesListHtml += `<div class="d-inline-flex flex-column me-3 mb-0"><span class="period-tag-sm">${escapeHtml(pName)}</span><div class="d-flex flex-wrap gap-1">${badgesHtml}</div></div>`;
                        }
                    }
                    
                    return {
                        studentName: enr.studentName,
                        gradesHtml: gradesListHtml,
                        avg,
                        presences,
                        absences,
                        justified
                    };
                });

                const results = await Promise.all(promises);
                
                tbody.innerHTML = results.map(r => {
                    const initial = (r.studentName || 'A').trim().charAt(0).toUpperCase();
                    return `
                    <tr>
                        <td class="align-middle">
                            <div class="d-flex align-items-center gap-2">
                                <span class="student-avatar-xs bg-label-primary text-primary">${initial}</span>
                                <span class="fw-bold text-truncate" style="max-width: 220px;" title="${escapeHtml(r.studentName)}">${escapeHtml(r.studentName)}</span>
                            </div>
                        </td>
                        <td class="align-middle" style="white-space: normal;">${r.gradesHtml}</td>
                        <td class="text-center align-middle"><span class="badge bg-label-info fw-bold grade-badge-sm">${r.avg}</span></td>
                        <td class="text-center align-middle"><span class="badge bg-label-success grade-badge-sm">${r.presences}</span></td>
                        <td class="text-center align-middle"><span class="badge bg-label-danger grade-badge-sm">${r.absences}</span></td>
                        <td class="text-center align-middle"><span class="badge bg-label-warning grade-badge-sm">${r.justified}</span></td>
                    </tr>
                `;
                }).join('');
                
                document.getElementById('studentsCount').textContent = `${results.length} aluno(s)`;

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Erro ao carregar dados.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
