<!DOCTYPE html>
<html lang="pt-BR" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default" data-assets-path="/assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Lançar Notas - Professor</title>
    <script src="/js/auth-guard.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/demo.css" />
    <link rel="stylesheet" href="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <script src="/assets/vendor/js/helpers.js"></script>
    <script src="/assets/js/config.js"></script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css" />
<script src="/js/global-modals.js"></script>
</head>
<body>
    <div class="layout-wrapper">
        <div class="layout-container">
            <div id="sidebar-container" data-sidebar="/components/teacher-sidebar.html"></div>
            <div class="layout-page">
                <div class="content-wrapper">
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fw-bold mb-0"><span class="text-muted fw-light">Avaliações /</span> Lançar Notas</h4>
                            <a href="/teacher/assessments.html" class="btn btn-outline-secondary">
                                <i class="bx bx-arrow-back me-1"></i> Voltar
                            </a>
                        </div>
                        <div id="alertContainer"></div>
                        <div class="row">
                            <div class="col-12">
                                <div class="card mb-4">
                                    <h5 class="card-header border-bottom">1. Dados da Avaliação</h5>
                                    <div class="card-body mt-3">
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label class="form-label" for="tcsId">Turma e Matéria *</label>
                                                <select id="tcsId" class="form-select" onchange="handleTcsChange(this.value)" required>
                                                    <option value="" disabled selected>Selecione uma turma...</option>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label" for="periodId">
                                                    Período Letivo * <span id="divisionTypeBadge" class="badge bg-label-info ms-1 d-none"></span>
                                                </label>
                                                <select id="periodId" class="form-select" required>
                                                    <option value="" disabled selected>Selecione uma turma primeiro...</option>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label" for="assessmentType">Tipo *</label>
                                                <select id="assessmentType" class="form-select" required>
                                                    <option value="EXAM">Prova</option>
                                                    <option value="ASSIGNMENT">Trabalho</option>
                                                    <option value="NOTEBOOK">Caderno</option>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label" for="date">Data da Avaliação *</label>
                                                <input type="date" id="date" class="form-control" required />
                                            </div>
                                            <div class="col-md-9">
                                                <label class="form-label" for="title">Título da Avaliação *</label>
                                                <input type="text" id="title" class="form-control" placeholder="Ex: Prova Mensal de Álgebra" required maxlength="100" />
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label" for="description">Descrição / Notas (Opcional)</label>
                                                <textarea id="description" class="form-control" rows="2" placeholder="Informações extras sobre a prova..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card d-none" id="gradesSection">
                                    <h5 class="card-header border-bottom d-flex justify-content-between align-items-center">
                                        <span>2. Lançamento de Notas</span>
                                        <span class="badge bg-label-info" id="studentCountBadge">0 alunos</span>
                                    </h5>
                                    <div class="card-body mt-3">
                                        <div id="studentsLoading" class="text-center py-4 d-none">
                                            <div class="spinner-border text-primary" role="status"></div>
                                            <div class="mt-2 text-muted">Carregando diário de alunos...</div>
                                        </div>
                                        <div class="table-responsive">
                                            <table class="table table-hover table-bordered">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th>Nome do Aluno</th>
                                                        <th class="text-center" style="min-width: 110px; width: 140px;">Nota (0 a 10)</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="studentsTableBody">
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="mt-4 text-end">
                                            <p class="text-muted small mb-2 text-start"><i class="bx bx-info-circle"></i> Deixe o campo em branco para alunos que faltaram e farão 2ª chamada.</p>
                                            <button type="button" class="btn btn-primary btn-lg" id="btnSave" onclick="saveAssessmentAndGrades()">
                                                <i class="bx bx-save me-1"></i> Salvar Avaliação e Notas
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer class="content-footer footer bg-footer-theme">
                        <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                            <div class="mb-2 mb-md-0">
                                © <script>document.write(new Date().getFullYear());</script> EscolaWeb
                            </div>
                        </div>
                    </footer>
                    <div class="content-backdrop fade"></div>
                </div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>
    
    <script src="/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="/assets/vendor/libs/popper/popper.js"></script>
    <script src="/assets/vendor/js/bootstrap.js"></script>
    <script src="/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="/assets/vendor/js/menu.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/js/load-sidebar.js"></script>
    
    <script>
        function getToken() { return localStorage.getItem('jwt_token') || ''; }
        async function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const cleanMsg = (message && String(message).trim()) ? String(message).trim() : 'Ocorreu um erro ao processar a solicitação.';
            if(container) {
                container.innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">${cleanMsg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
                window.scrollTo(0,0);
            } else {
                await window.showAlertModal('Aviso', cleanMsg);
            }
        }

        let myTcsList = [];
        let currentStudents = [];

        document.addEventListener("DOMContentLoaded", async function() {
            document.getElementById('date').valueAsDate = new Date();
            await loadTcs();
        });

        async function handleTcsChange(tcsId) {
            await loadPeriodsForTcs(tcsId);
            await loadStudentsForTcs(tcsId);
        }

        async function loadPeriodsForTcs(tcsId) {
            const tcs = myTcsList.find(t => String(t.id) === String(tcsId));
            const select = document.getElementById('periodId');
            const badge = document.getElementById('divisionTypeBadge');
            if (!tcs) {
                select.innerHTML = '<option value="" disabled selected>Selecione uma turma primeiro...</option>';
                badge.classList.add('d-none');
                return;
            }

            try {
                const res = await fetch(`/api/classrooms/${tcs.classRoomId}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.ok) {
                    const classroom = await res.json();
                    if (classroom.periodTypeLabel || classroom.periodType) {
                        badge.textContent = classroom.periodTypeLabel || classroom.periodType;
                        badge.classList.remove('d-none');
                    } else {
                        badge.classList.add('d-none');
                    }

                    const periods = classroom.periods || [];
                    if (periods.length === 0) {
                        select.innerHTML = '<option value="" disabled selected>Nenhum período cadastrado para esta divisão</option>';
                    } else {
                        select.innerHTML = '<option value="" disabled selected>Selecione o período...</option>';
                        periods.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.id;
                            opt.textContent = `${p.name}${p.closed ? ' (Fechado)' : ''}`;
                            if (p.closed) opt.disabled = true;
                            select.appendChild(opt);
                        });
                    }
                }
            } catch(e) {
                console.error('Erro ao carregar períodos da turma', e);
            }
        }

        async function loadTcs() {
            try {
                const res = await fetch('/api/teacher-class-subjects', { headers: { 'Authorization': `Bearer ${getToken()}` } });
                if (res.ok) {
                    const data = await res.json();
                    myTcsList = Array.isArray(data) ? data : (data.content || []);
                    const select = document.getElementById('tcsId');
                    myTcsList.forEach(tcs => {
                        const opt = document.createElement('option');
                        opt.value = tcs.id;
                        opt.textContent = `${tcs.classRoomName} - ${tcs.subjectName}`;
                        select.appendChild(opt);
                    });
                }
            } catch(e) { console.error(e); showAlert('Não foi possível carregar as turmas.', 'danger'); }
        }

        async function loadStudentsForTcs(tcsId) {
            const tcs = myTcsList.find(t => String(t.id) === String(tcsId));
            if (!tcs) return;

            const tbody = document.getElementById('studentsTableBody');
            const gradesSection = document.getElementById('gradesSection');
            const loading = document.getElementById('studentsLoading');
            const btnSave = document.getElementById('btnSave');
            const counter = document.getElementById('studentCountBadge');
            
            tbody.innerHTML = '';
            gradesSection.classList.remove('d-none');
            loading.classList.remove('d-none');
            btnSave.disabled = true;

            try {
                const res = await fetch(`/api/enrollments/classroom/${tcs.classRoomId}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
                if (res.ok) {
                    const enrollments = await res.json();
                    currentStudents = enrollments.filter(e => e.active).map(e => ({ id: e.studentId, name: e.studentName }));
                    
                    counter.textContent = `${currentStudents.length} alunos`;
                    
                    if (currentStudents.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Nenhum aluno matriculado nesta turma.</td></tr>';
                    } else {
                        renderGradesTable(currentStudents);
                        btnSave.disabled = false;
                    }
                }
            } catch(e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">Erro ao carregar alunos.</td></tr>';
            } finally {
                loading.classList.add('d-none');
            }
        }

        function renderGradesTable(students) {
            const tbody = document.getElementById('studentsTableBody');
            let html = '';
            students.forEach(s => {
                const safeName = s.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                html += `
                    <tr>
                        <td class="align-middle fw-semibold">${safeName}</td>
                        <td class="text-center">
                            <div class="input-group input-group-sm w-75 mx-auto">
                                <input type="number" class="form-control text-center fw-bold" name="grade_${s.id}" id="grade_${s.id}" min="0" max="10" step="0.1" placeholder="--">
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        async function saveAssessmentAndGrades() {
            const tcsId = document.getElementById('tcsId').value;
            const periodId = document.getElementById('periodId').value;
            const date = document.getElementById('date').value;
            const title = document.getElementById('title').value;
            const type = document.getElementById('assessmentType').value;
            const description = document.getElementById('description').value;

            if (!tcsId || !periodId || !date || !title || !type) {
                showAlert('Por favor, preencha todos os campos obrigatórios (*) da avaliação.', 'warning');
                return;
            }

            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando...';

            try {
                const assessmentPayload = {
                    title: title,
                    description: description,
                    date: date,
                    assessmentType: type,
                    teacherClassSubjectId: parseInt(tcsId),
                    periodId: parseInt(periodId)
                };

                const assRes = await fetch('/api/assessments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(assessmentPayload)
                });

                if (!assRes.ok) {
                    const err = await assRes.json().catch(()=>null);
                    const msg = window.extractErrorMessage ? window.extractErrorMessage(err, 'Erro ao criar a avaliação.') : (err?.message || 'Erro ao criar a avaliação.');
                    throw new Error(msg);
                }
                const assessment = await assRes.json();

                const gradePromises = [];
                currentStudents.forEach(student => {
                    const gradeInput = document.getElementById(`grade_${student.id}`).value;
                    if (gradeInput && gradeInput.trim() !== '') {
                        const gradeVal = parseFloat(gradeInput.replace(',', '.'));
                        if (gradeVal >= 0 && gradeVal <= 10) {
                            const gradePayload = {
                                studentId: student.id,
                                assessmentId: assessment.id,
                                value: gradeVal
                            };
                            gradePromises.push(
                                fetch('/api/grades', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                                    body: JSON.stringify(gradePayload)
                                })
                            );
                        }
                    }
                });

                const results = await Promise.all(gradePromises);
                
                const errors = [];
                for (let res of results) {
                    if (!res.ok) {
                        const err = await res.json().catch(()=>null);
                        const msg = window.extractErrorMessage ? window.extractErrorMessage(err, 'Erro ao lançar nota') : (err?.message || 'Erro ao lançar nota');
                        errors.push(msg);
                    }
                }
                if (errors.length > 0) {
                    throw new Error('Algumas notas falharam: ' + errors.join(', '));
                }
                
                window.location.href = '/teacher/assessments.html?success=true';
            } catch(error) {
                showAlert(error.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bx bx-save me-1"></i> Salvar Avaliação e Notas';
            }
        }
    </script>
    <script src="/js/load-sidebar.js"></script>
</body>
</html>
