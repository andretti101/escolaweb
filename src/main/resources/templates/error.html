<!DOCTYPE html>
<html lang="pt-BR" class="light-style" dir="ltr" data-theme="theme-default" data-assets-path="/assets/">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title th:text="'EscolaWeb — Erro ' + (${statusCode} ?: 500)">EscolaWeb — Erro</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="/assets/vendor/css/core.css" />
    <link rel="stylesheet" href="/assets/vendor/css/theme-default.css" />
    <link rel="stylesheet" href="/assets/css/demo.css" />
    <link rel="stylesheet" href="/assets/css/dark-mode.css" />
    <script>
        (function() {
            try {
                if (localStorage.getItem('escolaweb-theme') === 'dark') {
                    document.documentElement.classList.remove('light-style');
                    document.documentElement.classList.add('dark-style');
                }
            } catch (_e) {}
        })();
    </script>
</head>
<body>
<div class="container-xxl container-p-y d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0 text-center p-4 p-md-5" style="max-width: 540px; width: 100%; border-radius: 16px;">
        <div class="card-body">
            <div class="mb-3">
                <span class="badge bg-label-primary rounded-pill px-3 py-2 fs-6" th:text="'Código HTTP ' + (${statusCode} ?: 500)">Código HTTP 500</span>
            </div>
            <h1 class="display-3 fw-bold text-primary mb-2" th:text="${statusCode} ?: 500">500</h1>
            <h4 class="fw-bold mb-2" th:text="${errorTitle} ?: 'Erro Interno do Sistema'">Erro Interno do Sistema</h4>
            <p class="text-muted mb-4" th:text="${errorDescription} ?: 'Ocorreu uma falha inesperada ao processar sua solicitação.'">
                Ocorreu uma falha inesperada ao processar sua solicitação.
            </p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <a href="/" id="btnBackHome" class="btn btn-primary">
                    <i class="bx bx-home-alt me-1"></i> Voltar ao Painel
                </a>
                <a href="/entrar" class="btn btn-outline-secondary">
                    <i class="bx bx-log-in me-1"></i> Tela de Acesso
                </a>
            </div>
        </div>
    </div>
</div>
<script>
    (function() {
        try {
            const token = localStorage.getItem('jwt_token');
            const btn = document.getElementById('btnBackHome');
            if (!token && btn) {
                btn.setAttribute('href', '/entrar');
                return;
            }
            if (token && btn) {
                let base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const payload = JSON.parse(atob(base64));
                const role = String(payload.role || '').toUpperCase();
                if (role.includes('PRINCIPAL')) btn.setAttribute('href', '/direcao/painel');
                else if (role.includes('SECRETARY')) btn.setAttribute('href', '/secretaria/painel');
                else if (role.includes('TEACHER')) btn.setAttribute('href', '/professor/painel');
                else if (role.includes('STUDENT')) btn.setAttribute('href', '/aluno/painel');
            }
        } catch (_e) {}
    })();
</script>
</body>
</html>
